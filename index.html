<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laporan Pekerjaan SCADA</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{--bg:#f4f6fa;--card:#fff;--tx:#1c2430;--mut:#667085;--pri:#0b6fb8;--bd:#dde3ec}
@media(prefers-color-scheme:dark){:root{--bg:#10151c;--card:#1a212b;--tx:#e6ebf2;--mut:#93a0b3;--pri:#4aa3e8;--bd:#2d3846}}
*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--tx)}
header{background:linear-gradient(90deg,#0b6fb8,#12a4c9);color:#fff;padding:16px 20px}
header h1{margin:0;font-size:20px}header p{margin:2px 0 0;font-size:13px;opacity:.9}
main{padding:16px;max-width:1200px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:14px}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
label{font-size:12px;color:var(--mut);display:block;margin-bottom:3px}
input,select{width:100%;padding:8px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx)}
button{cursor:pointer;border:0;border-radius:6px;padding:8px 12px;background:var(--pri);color:#fff;font-size:13px}
button.sec{background:transparent;color:var(--pri);border:1px solid var(--pri)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--bd);text-align:left}th{background:var(--bg);white-space:nowrap}
td.c,th.c{text-align:center}.eye{background:none;color:var(--pri);font-size:18px;padding:2px 8px}
#msg{font-size:13px;color:var(--mut)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:20px;z-index:9}
.modal.on{display:flex}.box{background:var(--card);border-radius:10px;max-width:900px;width:100%;padding:16px}
.box h2{margin:0 0 8px;font-size:18px}.kv td:first-child{width:35%;color:var(--mut);font-weight:600}
.ph{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:6px 0 12px}
.ph figure{margin:0;font-size:11px;color:var(--mut)}.ph img{width:100%;height:110px;object-fit:cover;border-radius:6px;border:1px solid var(--bd);background:var(--bg)}
.miss{color:#d92d20;font-size:12px}
</style>
</head>
<body>
<header><h1>Laporan Pekerjaan SCADA</h1><p>Sumber: Sheet "Daftar Pemeliharaan" &amp; folder foto Google Drive</p></header>
<main>
<div class="card">
  <div class="filters">
    <div><label>Tanggal Dari</label><input type="date" id="fFrom"></div>
    <div><label>Tanggal Sampai</label><input type="date" id="fTo"></div>
    <div><label>Remote Station</label><select id="fRs"><option value="">Semua</option></select></div>
    <div><label>Jenis Pemeliharaan</label><select id="fJenis"><option value="">Semua</option></select></div>
    <div><label>Cari</label><input id="fQ" placeholder="Kata kunci..."></div>
  </div>
  <div class="bar">
    <button class="sec" onclick="resetF()">Reset</button>
    <button onclick="exportTabel()">Export Tabel (Excel)</button>
    <button onclick="exportFotoExcel()">Export Excel Foto Pembersihan Panel</button>
    <button onclick="downloadFotoZip(filtered)">Download Foto (ZIP)</button>
    <span id="msg">Memuat data...</span>
  </div>
</div>
<div class="card tw">
  <table><thead><tr><th class="c">No</th><th>Tanggal</th><th>Remote Station</th><th>Jenis Pemeliharaan</th><th class="c">Lihat Laporan</th></tr></thead>
  <tbody id="tb"></tbody></table>
</div>
</main>

<div class="modal" id="md" onclick="if(event.target===this)closeM()"><div class="box" id="mb"></div></div>

<script>
/* ====== KONFIGURASI ====== */
const API_URL = 'https://script.google.com/macros/s/AKfycbyShmVuHCsbo83mfewDQWPQvej7G7MqlLC1BY4FeaHHZZCX5x9f5Q9OmIWHgxjYC6f5/exec';
const CFG = {
  // Nama header kolom (regex). Ubah bila nama kolom di sheet berbeda.
  tanggal: /tanggal|tgl/i,
  remote: /remote station|repeater|nama aset|gardu|lokasi/i,
  jenis: /jenis pemeliharaan|jenis/i,
  fotoPanel: /pembersihan sekitar panel/i,
  fotoPanelIdx: 9,           // fallback: kolom J (indeks 0)
  excludeFoto: /sign|ttd|tanda tangan/i  // kolom foto yang tidak diexport
};
/* ========================= */
let H = [], R = [], FILES = [], FMAP = {}, filtered = [], IDX = {}, CACHE = {};
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const msg = t => $('msg').textContent = t;

function pDate(s){ s=String(s).trim(); let m;
  if(m=s.match(/^(\d{4})-(\d{2})-(\d{2})/)) return m[1]+'-'+m[2]+'-'+m[3];
  if(m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})/)) return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');
  return ''; }
const fD = iso => iso ? iso.split('-').reverse().join('/') : '-';
const fDf = iso => iso ? iso.split('-').reverse().join('-') : 'tanpa-tanggal';
const safe = s => String(s).replace(/[\\/:*?"<>|]+/g,'-').replace(/\s+/g,' ').trim();

async function load(){
  try{
    if(API_URL.startsWith('PASTE')) throw new Error('API_URL belum diisi');
    const j = await (await fetch(API_URL+'?action=data')).json();
    if(j.error) throw new Error(j.error);
    H=j.headers; FILES=j.files;
    const find=re=>{const i=H.findIndex(h=>re.test(h));return i};
    IDX={t:find(CFG.tanggal), r:find(CFG.remote), j:find(CFG.jenis)};
    FILES.forEach(f=>{const k=f.name.toLowerCase(); FMAP[k]=f; FMAP[k.replace(/\.[a-z0-9]+$/,'')]=FMAP[k.replace(/\.[a-z0-9]+$/,'')]||f;});
    R=j.rows.map((c,i)=>({i,c,d:pDate(c[IDX.t]||''),rs:String(c[IDX.r]||'').trim(),jn:String(c[IDX.j]||'').trim()}));
    R.sort((a,b)=>(a.d||'9999').localeCompare(b.d||'9999')||a.i-b.i);
    fill('fRs',R.map(x=>x.rs)); fill('fJenis',R.map(x=>x.jn));
    ['fFrom','fTo','fRs','fJenis'].forEach(i=>$(i).onchange=apply); $('fQ').oninput=apply;
    apply(); msg(R.length+' data dimuat, '+FILES.length+' foto di Drive');
  }catch(e){ msg('Gagal memuat: '+e.message); }
}
function fill(id,arr){ [...new Set(arr.filter(Boolean))].sort().forEach(v=>$(id).insertAdjacentHTML('beforeend','<option>'+esc(v)+'</option>')); }
function resetF(){ ['fFrom','fTo','fRs','fJenis','fQ'].forEach(i=>$(i).value=''); apply(); }
function apply(){
  const a=$('fFrom').value,b=$('fTo').value,rs=$('fRs').value,jn=$('fJenis').value,q=$('fQ').value.toLowerCase();
  filtered=R.filter(x=>(!a||x.d>=a)&&(!b||x.d&&x.d<=b)&&(!rs||x.rs===rs)&&(!jn||x.jn===jn)&&(!q||x.c.join(' ').toLowerCase().includes(q)));
  $('tb').innerHTML=filtered.map((x,n)=>`<tr><td class="c">${n+1}</td><td>${fD(x.d)}</td><td>${esc(x.rs)}</td><td>${esc(x.jn)}</td><td class="c"><button class="eye" title="Lihat laporan" onclick="openM(${x.i})">👁</button></td></tr>`).join('')||'<tr><td colspan="5" class="c">Tidak ada data</td></tr>';
  msg(filtered.length+' pekerjaan sesuai filter');
}

/* ===== Pencocokan foto: nama file di sel tabel <-> nama file di folder Drive ===== */
function photosOf(x){
  if(x.ph) return x.ph; const out=[], seen=new Set();
  x.c.forEach((cell,ci)=>{
    String(cell).split(/[,;\n|]+/).forEach(t=>{
      const base=t.trim().split(/[\\\/]/).pop().toLowerCase(); if(base.length<4) return;
      const f=FMAP[base]||FMAP[base.replace(/\.[a-z0-9]+$/,'')];
      if(f&&!seen.has(f.id)){seen.add(f.id); out.push({f,col:H[ci],ci,sign:CFG.excludeFoto.test(H[ci])});}
    });
  }); return x.ph=out;
}
const panelCol=()=>{const i=H.findIndex(h=>CFG.fotoPanel.test(h)); return i>=0?i:CFG.fotoPanelIdx;};
const docPhotos = x => photosOf(x).filter(p=>!p.sign);
const ext = f => (f.name.match(/\.[a-z0-9]+$/i)||['.jpg'])[0];

async function getImg(id){
  if(CACHE[id]) return CACHE[id];
  const j=await (await fetch(API_URL+'?action=photo&id='+id)).json();
  if(j.error) throw new Error(j.error);
  return CACHE[id]={mime:j.mime,url:'data:'+j.mime+';base64,'+j.b64,b64:j.b64};
}
function save(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000);}

/* ===== Modal detail ===== */
let curX=null;
async function openM(i){
  const x=R.find(r=>r.i===i); curX=x; const ph=photosOf(x);
  const photoCols=new Set(ph.map(p=>p.ci));
  const rows=H.map((h,ci)=>photoCols.has(ci)?null:`<tr><td>${esc(h)}</td><td>${esc(x.c[ci]||'-')}</td></tr>`).filter(Boolean).join('');
  const groups={}; ph.forEach(p=>(groups[p.col]=groups[p.col]||[]).push(p));
  const gh=Object.keys(groups).map(k=>`<b>${esc(k)}${CFG.excludeFoto.test(k)?' (sign – tidak ikut export)':''}</b><div class="ph">${groups[k].map(p=>`<figure><img data-id="${p.f.id}" alt=""><figcaption>${esc(p.f.name)}</figcaption></figure>`).join('')}</div>`).join('');
  $('mb').innerHTML=`<h2>Detail Laporan – ${esc(x.rs)} (${fD(x.d)})</h2>
  <div class="bar" style="margin:0 0 10px"><button onclick="exportDetailXls()">Export Excel</button><button onclick="exportDetailPdf()">Export PDF</button><button onclick="downloadFotoZip([curX])">Download Dokumentasi</button><button class="sec" onclick="closeM()">Tutup</button> <span id="msg2" class="miss"></span></div>
  <table class="kv">${rows}</table><h3>Dokumentasi</h3>${gh||'<p class="miss">Foto tidak ditemukan di folder Drive.</p>'}`;
  $('md').classList.add('on');
  document.querySelectorAll('#mb img[data-id]').forEach(async im=>{try{im.src=(await getImg(im.dataset.id)).url;}catch(e){}});
}
function closeM(){$('md').classList.remove('on');}

/* ===== Export ===== */
function exportTabel(){
  const aoa=[['No','Tanggal','Remote Station','Jenis Pemeliharaan']].concat(filtered.map((x,n)=>[n+1,fD(x.d),x.rs,x.jn]));
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(aoa),'Pekerjaan SCADA');
  XLSX.writeFile(wb,'Pekerjaan_SCADA.xlsx');
}
function exportFotoExcel(){
  const pc=panelCol(); const aoa=[['No','Tanggal','Remote Station','Jenis Pemeliharaan','Nama File Foto (Drive)','Link Drive','Status']];
  filtered.forEach((x,n)=>{
    const p=photosOf(x).filter(p=>p.ci===pc);
    aoa.push([n+1,fD(x.d),x.rs,x.jn,p.map(q=>q.f.name).join('\n'),p.map(q=>'https://drive.google.com/file/d/'+q.f.id+'/view').join('\n'),p.length?'Ditemukan':'Tidak ditemukan']);
  });
  const ws=XLSX.utils.aoa_to_sheet(aoa); ws['!cols']=[{wch:5},{wch:12},{wch:28},{wch:26},{wch:40},{wch:50},{wch:14}];
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'Foto Pembersihan Panel');
  XLSX.writeFile(wb,'Foto_Pembersihan_Sekitar_Panel_SCADA.xlsx');
}
function exportDetailXls(){
  const x=curX; const aoa=[['Kolom','Isi']].concat(H.map((h,i)=>[h,x.c[i]]));
  aoa.push([],['Dokumentasi (selain sign)','Nama File']); docPhotos(x).forEach(p=>aoa.push([p.col,p.f.name]));
  const ws=XLSX.utils.aoa_to_sheet(aoa); ws['!cols']=[{wch:38},{wch:60}];
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'Detail');
  XLSX.writeFile(wb,safe('Laporan_'+fDf(x.d)+'_'+x.rs)+'.xlsx');
}
async function exportDetailPdf(){
  const x=curX, m2=$('msg2'); m2.textContent='Menyiapkan PDF...';
  const doc=new jspdf.jsPDF({unit:'mm',format:'a4'}); doc.setFontSize(14);
  doc.text('Laporan Pekerjaan SCADA',14,15); doc.setFontSize(10); doc.text(x.rs+' – '+fD(x.d),14,21);
  const pcs=new Set(photosOf(x).map(p=>p.ci));
  doc.autoTable({startY:26,head:[['Kolom','Isi']],body:H.map((h,i)=>pcs.has(i)?null:[h,x.c[i]||'-']).filter(Boolean),styles:{fontSize:8},columnStyles:{0:{cellWidth:55}}});
  let y=doc.lastAutoTable.finalY+8, col=0; const ph=docPhotos(x);
  if(ph.length){ doc.setFontSize(11); if(y>270){doc.addPage();y=15;} doc.text('Dokumentasi',14,y); y+=4; }
  for(const p of ph){
    try{ const im=await getImg(p.f.id); if(y+62>285){doc.addPage();y=15;col=0;}
      doc.addImage(im.url,/png/.test(im.mime)?'PNG':'JPEG',14+col*92,y,86,52); doc.setFontSize(7); doc.text(p.col+' – '+p.f.name,14+col*92,y+56,{maxWidth:86});
      if(col===1){col=0;y+=62;}else col=1; }catch(e){}
  }
  doc.save(safe('Laporan_'+fDf(x.d)+'_'+x.rs)+'.pdf'); m2.textContent='';
}
/* Download foto: nama = tanggal (dd-mm-yyyy) + Remote Station/Repeater/aset + nomor urut */
async function downloadFotoZip(list){
  const items=[]; list.forEach(x=>docPhotos(x).forEach(p=>items.push({x,p})));
  if(!items.length){alert('Tidak ada foto yang cocok dengan folder Drive.');return;}
  const zip=new JSZip(), cnt={}; let done=0, q=0;
  const upd=()=>{msg('Mengunduh foto '+done+'/'+items.length+'...'); const m=$('msg2'); if(m)m.textContent=done+'/'+items.length;};
  const jobs=items.map(({x,p})=>{const base=safe(fDf(x.d)+'_'+x.rs); cnt[base]=(cnt[base]||0)+1; return {p,name:base+'_'+cnt[base]+ext(p.f)};});
  async function worker(){ while(q<jobs.length){ const j=jobs[q++]; try{ zip.file(j.name,(await getImg(j.p.f.id)).b64,{base64:true}); }catch(e){} done++; upd(); } }
  await Promise.all([worker(),worker(),worker(),worker()]);
  msg('Menyusun ZIP...'); save(await zip.generateAsync({type:'blob'}),'Foto_Dokumentasi_SCADA.zip'); msg('Selesai: '+done+' foto');
}
load();
</script>
</body>
</html>
