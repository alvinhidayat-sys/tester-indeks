<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>WO Batal — Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
:root{--bg:#0B1622;--card:#111F30;--card2:#17293C;--bd:rgba(255,255,255,.09);--tx:#E7EEF5;--dim:#93A6BA;--faint:#5F7286;--c1:#E3A857;--c2:#4FB6A8;--c3:#9B87C4;--ng:#E2665A;--ok:#6FBF96;--rd:#ff6b6b}
:root[data-theme=light]{--bg:#F2F4F6;--card:#fff;--card2:#F7F9FA;--bd:rgba(15,30,45,.12);--tx:#152233;--dim:#54687C;--faint:#8A99A8;--c1:#B97A1E;--c2:#1C8C7E;--c3:#6B55A8;--ng:#C93B2E;--ok:#1E8E55;--rd:#dc2626}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx)}
body{font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:14px;line-height:1.5}
.wrap{max-width:1320px;margin:0 auto;padding:18px 22px 60px}
header{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--bd);margin-bottom:18px}
h1{font-size:18px;margin:0;font-weight:600}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.b{border:1px solid var(--bd);background:var(--card);color:var(--dim);font:inherit;font-size:12.5px;padding:8px 12px;border-radius:6px;cursor:pointer}
.b:hover{color:var(--tx);border-color:var(--c2)}
.b:disabled{opacity:.6;cursor:progress}
.stat{font-size:12px;color:var(--faint);font-family:'IBM Plex Mono',monospace}
.stat.err{color:var(--ng)}
.spin{display:inline-block;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.filters{display:flex;gap:14px;flex-wrap:wrap;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px 16px;margin-bottom:16px}
.fg{display:flex;flex-direction:column;gap:5px;min-width:180px;flex:1}
.fg label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);font-weight:600}
select,input.s{background:var(--card2);color:var(--tx);border:1px solid var(--bd);border-radius:6px;padding:9px 11px;font:inherit;font-size:13.5px;min-height:40px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kc{background:var(--card);border:1px solid var(--bd);border-left:3px solid var(--a);border-radius:8px;padding:13px 15px}
.kc .l{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);font-weight:600}
.kc .v{font-family:'IBM Plex Mono',monospace;font-size:21px;font-weight:600;margin-top:6px}
.kc .s{font-size:11.5px;color:var(--dim)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:18px;margin-bottom:18px;min-width:0}
.ch{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.ch h2{margin:0;font-size:16px;font-weight:600}
.ch .tools input{min-width:240px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px}
.grid2 .full{grid-column:1/-1}
.grid2 h3{margin:0 0 8px;font-size:13.5px;font-weight:600}
.cbox{position:relative;height:320px}
.tw{overflow:auto;max-height:520px;border:1px solid var(--bd);border-radius:8px}
table{border-collapse:collapse;width:100%;min-width:900px;font-size:12.5px}
th,td{padding:8px 10px;border-bottom:1px solid var(--bd);white-space:nowrap}
thead th{position:sticky;top:0;background:var(--card2);z-index:1;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--tx);font-weight:600;cursor:pointer;text-align:center;border-left:1px solid var(--bd)}
thead tr:nth-child(2) th{top:34px}
thead th:first-child{border-left:0}
th i{font-style:normal;opacity:.6}
td{color:var(--dim);text-align:right;font-family:'IBM Plex Mono',monospace}
td.k{text-align:left;color:var(--tx);font-family:'IBM Plex Sans',sans-serif;font-weight:600}
tfoot td{font-weight:700;color:var(--tx);background:var(--card2)}
tbody tr:hover td{background:var(--card2)}
.c1{color:var(--c1)!important}.c2{color:var(--c2)!important}.c3{color:var(--c3)!important}.ng{color:var(--ng)!important}
th.rd,td.rd{color:var(--rd)!important;font-weight:800}
.clk{cursor:pointer}.clk:hover{text-decoration:underline}
.kc.clk:hover{border-color:var(--a)}
.rb{border:0;background:rgba(79,182,168,.16);color:var(--c2);border-radius:6px;padding:5px 9px;cursor:pointer;font:600 12px 'IBM Plex Sans',sans-serif;white-space:nowrap}
.em{text-align:center;color:var(--faint);padding:24px;font-family:inherit}
.ov{position:fixed;inset:0;background:rgba(5,10,15,.6);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.ov.on{display:flex}
.md{background:var(--card);border:1px solid var(--bd);border-radius:12px;width:min(1100px,100%);max-height:88vh;display:flex;flex-direction:column}
.mh{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;padding:14px 16px;border-bottom:1px solid var(--bd)}
.mh b{font-size:15px}
.mb{overflow:auto;padding:12px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--card2);border:1px solid var(--bd);padding:10px 14px;border-radius:8px;font-size:13px;z-index:60;max-width:92vw}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}
@media(max-width:640px){.wrap{padding:12px 12px 40px}.fg{min-width:100%}.ch .tools input{min-width:100%}}

:root{--zb:#14253a}
:root[data-theme=light]{--zb:#f1f5f8}
th,td{border-right:1px solid var(--bd)}
tbody tr:nth-child(even) td{background:var(--zb)}
tbody tr:hover td{background:var(--card2)}
td.k,thead th:first-child,tfoot td:first-child{position:sticky;left:0;z-index:2;background:var(--card)}
thead th:first-child{z-index:3;background:var(--card2)}
tbody tr:nth-child(even) td.k{background:var(--zb)}
tfoot td:first-child{background:var(--card2)}
.dg{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 14px;margin-bottom:16px}.dg summary{cursor:pointer;color:var(--dim);font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>WO Batal — Command Center</h1>
    <div class="tools">
      <span class="stat" id="st">Memuat…</span>
      <button class="b" id="sy" title="Cek folder dan ambil data terbaru"><span id="syi">⟳</span> Sinkron</button>
      <button class="b" id="th" title="Ganti tema terang/gelap">🌙 / ☀️</button>
    </div>
  </header>

  <div class="filters">
    <div class="fg"><label for="fb">Bulan</label><select id="fb"></select></div>
    <div class="fg"><label for="fd">Distribusi</label><select id="fd"></select></div>
    <div class="fg"><label for="fa">Area</label><select id="fa"></select></div>
    <div class="fg"><label for="fp">Posko</label><select id="fp"></select></div>
    <div class="fg" style="flex:0;min-width:0;justify-content:flex-end"><label>&nbsp;</label><button class="b" id="rs">Reset</button></div>
  </div>

  <details class="dg"><summary>Status data &amp; file</summary><div id="dgb" style="margin-top:10px"></div></details>
  <div class="kpis" id="kp"></div>

  <div class="grid2">
    <div class="card full"><h3>Batal per <span id="u1">Area</span> menurut tipe batal</h3><div class="cbox"><canvas id="c1"></canvas></div></div>
    <div class="card"><h3>Kategori Batal Command Center</h3><div class="cbox"><canvas id="c2"></canvas></div></div>
    <div class="card"><h3>WO Batal Per Unit</h3><div class="cbox"><canvas id="c3"></canvas></div></div>
  </div>

  <section class="card">
    <div class="ch">
      <div><h2 id="j1">🚫 Rekapitulasi Laporan Batal</h2></div>
      <div class="tools">
        <input class="s" id="q1" placeholder="🔍 Cari…">
        <button class="b" data-x="t1" data-m="rekap">⬇ Rekap</button>
        <button class="b" data-x="t1" data-m="detail">⬇ Detail</button>
      </div>
    </div>
    <div class="tw" id="t1"></div>
  </section>

  <section class="card">
    <div class="ch">
      <div><h2 id="j2">🗂️ Kategori Batal Command Center</h2><small style="color:var(--faint);font-size:12px">Hanya tipe batal by Comcen. Alasan batal dikelompokkan otomatis.</small></div>
      <div class="tools">
        <input class="s" id="q2" placeholder="🔍 Cari…">
        <button class="b" data-x="t2" data-m="rekap">⬇ Rekap</button>
        <button class="b" data-x="t2" data-m="detail">⬇ Detail</button>
      </div>
    </div>
    <div class="tw" id="t2"></div>
  </section>
</div>

<div class="ov" id="ov">
  <div class="md">
    <div class="mh"><b id="mt"></b><div class="tools"><button class="b" id="mx">⬇ Excel</button><button class="b" id="mc">✕ Tutup</button></div></div>
    <div class="mb" id="mb"></div>
  </div>
</div>
<div class="toast" id="tst" hidden></div>

<script>
/* ===== KONFIGURASI ===== */
const APPS_URL='https://script.google.com/macros/s/AKfycbwj07hp-nTx4ghx0E8g6eHcHEqN8hiamt8izoQeo5FMhquHOKM6L0KMoGG5sMXhwkSN/exec';
const AUTO_MS=180000;
const BLN=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];

/* ===== UTIL & STATE ===== */
const $=s=>document.querySelector(s),D={p2b:[],cc:[]},KM={},TB={},CACHE={},CH={};
let AF={d:'',a:'',p:''},MX=null,KPI=[],busy=false,diag='';
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f=(v,d=0)=>v==null||isNaN(v)?'-':Number(v).toLocaleString('id-ID',{minimumFractionDigits:d,maximumFractionDigits:d});
const i0=v=>f(v,0),pc=v=>v==null?'-':f(v,2)+'%';
const slug=s=>String(s==null?'':s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Za-z0-9]+/g,'_').replace(/^_+|_+$/g,'').slice(0,50)||'Data';
const toast=(m,err)=>{const t=$('#tst');t.textContent=m;t.hidden=false;t.style.borderLeft='3px solid '+(err?'var(--ng)':'var(--ok)');clearTimeout(t._h);t._h=setTimeout(()=>t.hidden=true,4500)};

/* ===== BACA DATA (daftar file dari Apps Script, isi dari gviz) ===== */
async function fetchList(){
  const r=await fetch(APPS_URL+'?t='+Date.now(),{cache:'no-store'});
  if(!r.ok)throw new Error('Apps Script HTTP '+r.status);
  const j=await r.json();if(j.error)throw new Error(j.error);return j;
}
function csv(t){const r=[];let w=[],c='',q=0;for(let i=0;i<t.length;i++){const x=t[i];
  if(q){if(x=='"'){if(t[i+1]=='"'){c+='"';i++}else q=0}else c+=x}
  else if(x=='"')q=1;else if(x==','){w.push(c);c=''}else if(x=='\n'){w.push(c);r.push(w);w=[];c=''}else if(x!='\r')c+=x}
  if(c||w.length){w.push(c);r.push(w)}return r}
const NEED=new Set(['NOLAPORAN','NAMADISTRIBUSI','NAMAAREA','NAMAPOSKO','TGLLAPOR','BLTH','APKTSTATUS','STATUSAPKT','TIPEBATAL','JENISBATAL','TIPEPEMBATALAN','ALASANBATAL','ALASANPEMBATALAN','KETERANGANBATAL','KETBATAL','BATALBY']);
const normH=x=>String(x).trim().toUpperCase().replace(/[^A-Z0-9]+/g,'_').replace(/^_+|_+$/g,'');
const isNeed=h=>{const n=h.replace(/[^A-Z0-9]/g,'');return NEED.has(n)||(n.includes('BATAL')&&(n.includes('TIPE')||n.includes('JENIS'))&&!n.includes('ALASAN')&&!n.includes('KET'))};
const colL=i=>{let s='';for(i++;i>0;i=Math.floor((i-1)/26))s=String.fromCharCode(65+(i-1)%26)+s;return s};
async function gv(id,q){
  const res=await fetch(`https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:csv${q?'&tq='+encodeURIComponent(q):''}&_=${Date.now()}`,{cache:'no-store'});
  if(!res.ok)throw new Error('HTTP '+res.status);
  const txt=await res.text();
  if(/^\s*<(!doctype|html)/i.test(txt))throw new Error('belum dibagikan sebagai Pelihat');
  return csv(txt);
}
function toRows(r,name,g){
  const h=r[0].map(normH);
  return r.slice(1).filter(x=>x.some(v=>v!=='')).map(x=>{const o={_SHEET:g,_FILE:name};h.forEach((k,i)=>{const v=(x[i]||'').trim();if(o[k]===undefined||o[k]==='')o[k]=v});return o});
}
// ambil hanya kolom yang dipakai dashboard (jauh lebih kecil & cepat); bila gagal, ambil semua kolom
async function loadSheet(id,name,g){
  try{
    const hd=(await gv(id,'select * limit 1'))[0]||[];
    const idx=[];hd.forEach((x,i)=>{if(isNeed(normH(x)))idx.push(i)});
    if(idx.some(i=>normH(hd[i])=='NO_LAPORAN')){
      const r=await gv(id,'select '+idx.map(colL).join(','));
      if(r.length&&r[0].length==idx.length)return toRows(r,name,g);
    }
  }catch(e){if(/belum dibagikan/.test(e.message))throw e}
  return toRows(await gv(id,''),name,g);
}
const GS='application/vnd.google-apps.spreadsheet';
let DIAG=[];
/* ===== ATURAN BACA DATA (PATEN) =====
   1. Semua file di kedua folder (Kode G + COMCEN) dibaca otomatis, nama file bebas.
   2. Semua baris digabung per NO_LAPORAN (dinormalkan), lintas file & lintas bulan; COMCEN diprioritaskan,
      kolom kosong diisi dari file lain yang punya nilainya.
   3. Bulan = 2 angka di depan nama file (01-12) untuk semua baris file itu; bila nama tidak berawalan MM:
      per baris BLTH -> bulan file -> TGL_LAPOR. Penggabungan per (bulan + NO_LAPORAN).
   4. Kolom status/tipe/alasan batal dicari per baris (bukan per file) setelah penggabungan,
      jadi tidak tergantung baris pertama di file. */
const noKey=r=>{const v=String(r.NO_LAPORAN==null?'':r.NO_LAPORAN).trim().replace(/^'+/,'').replace(/\.0+$/,'').replace(/\s+/g,'').toUpperCase();return v};
function pickCol(r,al,fz){
  for(const k in r){if(k[0]=='_')continue;const n=k.replace(/[^A-Z0-9]/g,'');
    if(al.includes(n)||(fz&&fz(n))){const v=r[k];if(v!==''&&v!=null)return v}}
  return '';
}
const A_S=['APKTSTATUS','STATUSAPKT'],A_T=['TIPEBATAL','JENISBATAL','TIPEPEMBATALAN'],A_A=['ALASANBATAL','ALASANPEMBATALAN','KETERANGANBATAL','KETBATAL'];
const fzT=n=>n.includes('BATAL')&&(n.includes('TIPE')||n.includes('JENIS'))&&!n.includes('ALASAN')&&!n.includes('KET');
function canon(r){r._S=pickCol(r,A_S);r._T=pickCol(r,A_T,fzT);r._A=pickCol(r,A_A);
  // skema tanpa kolom TIPE_BATAL (mis. Kode G Oktober): batal dengan alasan / BATAL_BY terisi = dibatalkan Command Center
  if(!r._T&&/batal/i.test(r._S)&&(r._A||pickCol(r,['BATALBY']))){r._T='Batal by Comcen';r._TD=1}}
function dateNum(v){const s=String(v||'');let m=s.match(/(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/);
  if(m&&+m[2]>=1&&+m[2]<=12)return +m[1]*100+ +m[2];
  m=s.match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})/);
  if(m){let a=+m[1],b=+m[2];const mo=a>12?b:(b>12?a:b);if(mo>=1&&mo<=12)return +m[3]*100+mo}
  return 0}
function assemble(files){
  files.forEach(f=>{f.byName=!!nameMM(f.name);f.per=periodOf(f.rows,f.name)});
  const order=files.slice().sort((a,b)=>(a.g=='cc'?0:1)-(b.g=='cc'?0:1));
  const M=new Map(),cnt={};let anon=0;
  const bump=(p,g)=>{(cnt[p]||(cnt[p]={cc:0,p2b:0}))[g]++};
  order.forEach(f=>{f.months=new Set();
    f.rows.forEach(r=>{
      const p=f.byName?f.per:(blthNum(blth(r))||f.per||0);f.months.add(p);bump(p,f.g);
      const nk=noKey(r),k=nk?(p+'|'+nk):('#'+(anon++));
      let m=M.get(k);
      if(!m){m={...r};if(nk)m.NO_LAPORAN=nk;m._PER=p;m._G={cc:0,p2b:0};m._G[f.g]=1;M.set(k,m);return}
      m._G[f.g]=1;if(!m._PER&&p)m._PER=p;
      for(const c in r)if(c[0]!='_'&&(m[c]===undefined||m[c]==='')&&r[c]!=='')m[c]=r[c];
    })});
  const all=[...M.values()];
  all.forEach(m=>{canon(m);if(!m._PER)m._PER=dateNum(m.TGL_LAPOR)||0});
  for(const k in KM)delete KM[k];
  const by=new Map();all.forEach(m=>{if(!by.has(m._PER))by.set(m._PER,[]);by.get(m._PER).push(m)});
  const sum=[...by.keys()].sort((a,b)=>(a||1e9)-(b||1e9)).map(p=>{const rows=by.get(p),bl=rows.filter(isBt),c=cnt[p]||{cc:0,p2b:0};
    return{p,cc:c.cc,kg:c.p2b,uniq:rows.length,rows,bl:bl.length,kos:bl.filter(r=>!gT(r)).length,turun:bl.filter(r=>r._TD).length,area:rows.filter(r=>r.NAMA_AREA).length,onlyKG:rows.filter(r=>r._G.p2b&&!r._G.cc).length}});
  return{all,files,sum};
}
function renderDiag(){
  const rows=DIAG.map(d=>{const folder=d.g=='cc'?'COMCEN':d.g=='p2b'?'Kode G':'Ringkasan';
    return`<tr><td class="k">${esc(d.f)}</td><td style="text-align:left">${folder}</td><td style="text-align:left">${d.per?plbl(d.per):'-'}</td><td>${d.n!=null?i0(d.n):'-'}</td><td style="text-align:left;white-space:normal">${esc(d.note)}</td></tr>`}).join('');
  $('#dgb').innerHTML=`<div class="tw"><table style="min-width:760px"><thead><tr><th>File / Ringkasan</th><th>Folder</th><th>Bulan</th><th>Baris</th><th>Catatan</th></tr></thead><tbody>${rows||'<tr><td class="em" colspan="5">Belum ada data.</td></tr>'}</tbody></table></div>`;
}
const idb=(()=>{let p;const open=()=>p||(p=new Promise((ok,no)=>{try{const q=indexedDB.open('wo-batal',1);q.onupgradeneeded=()=>q.result.createObjectStore('f');q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)}catch(e){no(e)}}));
  return{get:k=>open().then(d=>new Promise(r=>{const q=d.transaction('f').objectStore('f').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r()})).catch(()=>{}),
    set:(k,v)=>open().then(d=>{d.transaction('f','readwrite').objectStore('f').put(v,k)}).catch(()=>{})}})();
function finish(files,diag){
  const{all,files:fs,sum}=assemble(files);
  D.p2b=all;D.cc=[];
  fs.forEach(f=>{const ms=[...(f.months||[])].filter(Boolean).sort().map(plbl).join(', ');diag.push({f:f.name,g:f.g,per:f.per,n:f.rows.length,note:!f.rows.length?'kosong':(ms?'dibaca · bulan: '+ms:'dibaca · bulan tidak terdeteksi (cek nama file berawalan MM, kolom BLTH atau TGL_LAPOR)')})});
  sum.forEach(x=>diag.push({f:'Bulan '+plbl(x.p),g:'sum',per:x.p,n:x.uniq,note:`baris COMCEN ${x.cc} · Kode G ${x.kg} · laporan unik ${x.uniq} · batal ${x.bl} · tipe kosong ${x.kos} · hanya di Kode G ${x.onlyKG}`+(x.turun?` · tipe diturunkan dari alasan/BATAL_BY ${x.turun}`:'')+(x.area?'':' · area & posko tidak tersedia')}));
  DIAG=diag;fillAll();renderDiag();
}
async function boot(){   // tampilkan data tersimpan lebih dulu, lalu sinkron di latar
  try{const sn=await idb.get('snap');
    if(sn&&sn.length){sn.forEach(x=>{CACHE[x.id]={mt:x.mt,rows:x.rows}});finish(sn.map(x=>({g:x.g,name:x.name,rows:x.rows})),[]);
      $('#st').className='stat';$('#st').textContent='Data tersimpan · memperbarui…'}}catch(e){}
  sync();
}
async function sync(){
  if(busy)return;busy=true;const b=$('#sy');b.disabled=true;$('#syi').classList.add('spin');
  try{
    const L=await fetchList(),diag=[],jobs=[];
    for(const g of ['p2b','cc'])for(const fl of (L[g]||[])){
      if(fl.mime&&fl.mime!==GS){diag.push({f:fl.name,g,per:0,n:0,note:'bukan Google Sheets: tunggu konversi otomatis atau jalankan ulang Apps Script'});continue}
      jobs.push((async()=>{
        try{
          const c=CACHE[fl.id];let rows;
          if(c&&c.mt==fl.modifiedTime)rows=c.rows;
          else{rows=await loadSheet(fl.id,fl.name,g);CACHE[fl.id]={mt:fl.modifiedTime,rows}}
          return{g,name:fl.name,id:fl.id,mt:fl.modifiedTime,rows};
        }catch(e){diag.push({f:fl.name,g,per:0,n:0,note:'gagal dibaca: '+e.message});return null}
      })());
    }
    const files=(await Promise.all(jobs)).filter(Boolean);   // semua file diunduh bersamaan
    finish(files,diag);
    idb.set('snap',files);
    $('#st').className='stat';$('#st').textContent='Diperbarui '+new Date().toLocaleTimeString('id-ID');
    const perlu=diag.filter(d=>d.g!='sum'&&!/^dibaca/.test(d.note)).length;
    if(perlu)toast(perlu+' file perlu perhatian, lihat Status data',true);
  }catch(e){$('#st').className='stat err';$('#st').textContent=e.message;toast(e.message,true)}
  busy=false;b.disabled=false;$('#syi').classList.remove('spin');
}

/* ===== KLASIFIKASI ALASAN BATAL (tidak berubah) ===== */
const BCAT=[
 ['Batal Tidak Sesuai Prosedur',[/(tidak|tdk|tak|bkn|ga|gak)\s*(sesuai|sesui|sesua|sesuay)/,/pros[ei]?du?r/,/\bsop\b/]],
 ['Belum Ada Petugas Yantek / Unit Blankspot',[/belum\s*ada\s*(petugas|yantek|regu)/,/blank\s*spot|blankspot|blank\s*sport/,/petugas\s*yantek|unit\s*blank/]],
 ['Bukan Gangguan PLN',[/bukan\s*(gangguan|ggn|gng)/,/non\s*gangguan/]],
 ['Ditindaklanjuti Team Pemeliharaan',[/tindak\s*lanjut/,/(tim|team)\s*(pemeliharaan|har)\b/,/pemeliharaan/]],
 ['Gangguan Intranet / Sistem APKT',[/intranet/,/(sistem|system)\s*apkt/,/apkt\s*(error|eror|down|trouble|gangguan|bermasalah|lemot)/,/gangguan\s*(sistem|system|apkt|jaringan)/]],
 ['Instalasi Pelanggan Bermasalah',[/instalasi/,/\bip\s*(pelanggan|bermasalah)/]],
 ['Kondisi Keamanan / Bencana Alam',[/keamanan/,/bencana/,/banjir|longsor|gempa|kerusuhan/]],
 ['Laporan Ganda',[/\bganda\b/,/double|doubel|dobel|duplikat|duplicate/]],
 ['Padam Meluas Tidak Masuk Marking (Diluar Range Kode Referensi Marking)',[/padam\s*meluas/,/(di\s*)?luar\s*range/,/kode\s*referensi/,/(tidak|tdk)\s*masuk\s*marking/]],
 ['Pelanggan P2TL / Non Distribusi',[/p\s*2\s*t\s*l/,/non\s*distribusi/]],
 ['Pelanggan Tidak Dapat Dihubungi & Alamat Tidak Ditemukan',[/dihubungi|menghubungi|hubungi/,/alamat\s*(tidak|tdk|tak)/,/(tidak|tdk)\s*ditemukan/]],
 ['Pelanggan Tidak Dilokasi / Menunda Perbaikan',[/(tidak|tdk)\s*(di\s*)?lokasi/,/menunda|ditunda|tunda/,/(tidak|tdk)\s*ada\s*(di\s*)?(lokasi|rumah)/,/(tidak|tdk)\s*(di\s*)?rumah/]],
 ['Sudah Dikerjakan Pihak Lain',[/sudah\s*(di\s*)?(kerja|selesai|tangani)/,/sdh\s*(di\s*)?kerja/,/dikerjakan/,/pihak\s*lain/]],
 ['Tanpa Kategori / Keterangan',[/tanpa\s*(kategori|keterangan|ket)\b/]],
 ['Kategori tidak Terbaca',[]]
];
const BTK=13,BTR=14,NC=BCAT.length;   // 13 = kosong, 14 = teks di luar daftar
const BTL={cm:'Batal by Comcen',cc:'Batal by Call Center',pm:'Batal by PLN Mobile',ot:'Tipe Lain / Kosong'};
const nz=s=>String(s==null?'':s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/&/g,' dan ').replace(/[^a-z0-9]+/g,' ').trim();
const emptyN=n=>!n||/^(null|nan|na|n a|undefined|none|nil|nihil|kosong)$/.test(n);
function lev(a,b){if(a==b)return 0;const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]==b[j-1]?0:1));p=c}return p[n]}
const BCN=BCAT.map(c=>nz(c[0])),bkC=new Map();
function bkat(raw){const n=nz(raw);if(emptyN(n))return BTK;if(bkC.has(n))return bkC.get(n);
  let r=BCN.indexOf(n);
  if(r<0){const nc=n.replace(/ /g,'');r=BCN.findIndex(x=>x.replace(/ /g,'')==nc)}
  if(r<0)r=BCAT.findIndex(c=>c[1].some(x=>x.test(n)));
  if(r<0){let best=0;BCN.forEach((x,i)=>{if(i==BTK||i==BTR)return;const sc=1-lev(n,x)/Math.max(n.length,x.length);if(sc>best){best=sc;r=i}});if(best<.75)r=-1}
  if(r<0)r=BTR;bkC.set(n,r);return r}
const btipe=raw=>{const n=nz(raw);if(/com\s*cen|command/.test(n))return'cm';if(/call|\bcc\b|contact/.test(n))return'cc';if(/mobile|\bpm\b/.test(n))return'pm';return'ot'};
const hasKet=v=>!emptyN(nz(v));

/* kolom dicari fleksibel: abaikan spasi/underscore/huruf besar-kecil (cache per file) */
function fkey(r,tag,al){const ks=Object.keys(r).map(x=>[x,x.replace(/[^A-Z0-9]/g,'')]);
  for(const a of al){const h=ks.find(([,n])=>n==a);if(h)return h[0]}
  if(tag=='t')return(ks.find(([,n])=>n.includes('BATAL')&&(n.includes('TIPE')||n.includes('JENIS'))&&!n.includes('ALASAN')&&!n.includes('KET'))||[null])[0];
  return null}
function ck(r,tag,al){const m=KM[r._FILE]||(KM[r._FILE]={});if(!(tag in m))m[tag]=fkey(r,tag,al);return m[tag]?r[m[tag]]:''}
const gS=r=>r._S||'',gT=r=>r._T||'',gA=r=>r._A||'';
const isBt=r=>/batal/i.test(gS(r));
const uq=rows=>new Set(rows.map((r,i)=>r.NO_LAPORAN||'x'+i)).size;

function bcalc(rows){
  const m=new Map();rows.forEach((r,i)=>{if(isBt(r))m.set(r.NO_LAPORAN||'x'+i+r._FILE,r)});
  const c={tot:uq(rows),b:m.size,cm:0,cmk:0,cc:0,cck:0,pm:0,pmk:0,ot:0,list:[...m.values()]};
  m.forEach(r=>{const t=btipe(gT(r));c[t]++;if(t!='ot'&&hasKet(gA(r)))c[t+'k']++});
  return c;
}
const bdet=rows=>rows.map(r=>{const t=btipe(gT(r));return{...r,TIPE_BATAL:BTL[t],ALASAN_BATAL:gA(r),KATEGORI_BATAL:t=='cm'?BCAT[bkat(gA(r))][0]:'-'}});
const ticketInfo=r=>{const b=isBt(r),t=btipe(gT(r));return{st:gS(r),tipe:b?BTL[t]:'-',alasan:b?gA(r):'-',kat:b&&t=='cm'?BCAT[bkat(gA(r))][0]:'-'}};
const ticketRows=list=>list.map(r=>{const x=ticketInfo(r);return{Distribusi:r.NAMA_DISTRIBUSI,Area:r.NAMA_AREA,Posko:r.NAMA_POSKO,'No. Laporan':r.NO_LAPORAN,'Tgl Lapor':r.TGL_LAPOR,'Status APKT':x.st,'Tipe Batal':x.tipe,'Alasan Batal (asli)':x.alasan,'Kategori Batal':x.kat,'File Sumber':r._FILE}});
function grp(rows,nk){const m=new Map();rows.forEach(r=>{const k=KEYS.slice(0,nk).map(x=>r[x]),s=k.join('|');if(!m.has(s))m.set(s,{k,rows:[]});m.get(s).rows.push(r)});
  return[...m.values()].sort((a,b)=>a.k.join().localeCompare(b.k.join()))}


/* ===== PERIODE (bulan dari file) ===== */
const blth=r=>{const k=Object.keys(r).find(x=>x.replace(/[^A-Z0-9]/g,'')=='BLTH');return k?r[k]:''};
function blthNum(v){let s=String(v==null?'':v).trim();if(!s)return null;
  let m=s.match(/^(\d{1,2})[\/\-.](\d{4})$/);if(m&&+m[1]>=1&&+m[1]<=12)return +m[2]*100+ +m[1];
  s=s.replace(/^(\d{6})[.,]0+$/,'$1');const d=s.replace(/\D/g,'');if(d.length!=6)return null;
  const y=+d.slice(0,4),mo=+d.slice(4);return y>=2000&&mo>=1&&mo<=12?y*100+mo:null}
// kode periode = YYYYMM; 0 bila tidak diketahui
const BLNK=[['jan','januari','january'],['feb','februari','february'],['mar','maret','march'],['apr','april'],['mei','may'],['jun','juni','june'],['jul','juli','july'],['agu','agt','agus','agustus','aug','august'],['sep','sept','september'],['okt','oct','oktober','october'],['nov','november'],['des','dec','desember','december']];
function nameMonth(name){
  const n=nz(name).replace(/(\d+)/g,' $1 '),t=n.split(/\s+/).filter(Boolean);
  let y=0,mo=-1;
  t.forEach(x=>{if(/^20\d\d$/.test(x))y=+x;const q=x.match(/^(20\d\d)(0[1-9]|1[0-2])$/);if(q){y=+q[1];mo=+q[2]-1}});
  if(mo<0)mo=BLNK.findIndex(a=>t.some(x=>a.includes(x)));
  if(mo<0){const d=t.find(x=>/^(0?[1-9]|1[0-2])$/.test(x));if(d)mo=+d-1}
  return y&&mo>=0?y*100+mo+1:0}
// acuan utama: 2 angka di depan nama file = bulan (01..12); tahun dari BLTH / TGL_LAPOR / nama file / tahun berjalan
const nameMM=name=>{const m=String(name||'').trim().match(/^(0[1-9]|1[0-2])(?!\d)/);return m?+m[1]:0};
function yearOf(rows,name){
  const c={};rows.forEach(r=>{const v=blthNum(blth(r));const y=v?Math.floor(v/100):Math.floor(dateNum(r.TGL_LAPOR)/100);if(y)c[y]=(c[y]||0)+1});
  const t=Object.entries(c).sort((a,b)=>b[1]-a[1])[0];if(t)return +t[0];
  const ny=(String(name||'').match(/20\d\d/)||[])[0];return ny?+ny:new Date().getFullYear()}
function periodOf(rows,name){
  const mm=nameMM(name);if(mm)return yearOf(rows,name)*100+mm;
  const cnt={};rows.forEach(r=>{const v=blthNum(blth(r));if(v)cnt[v]=(cnt[v]||0)+1});
  const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0];
  if(top)return +top[0];
  const nm=nameMonth(name);if(nm)return nm;
  const dc={};rows.forEach(r=>{const v=dateNum(r.TGL_LAPOR);if(v)dc[v]=(dc[v]||0)+1});
  const dt=Object.entries(dc).sort((a,b)=>b[1]-a[1])[0];
  return dt?+dt[0]:0;
}
const plbl=p=>p?BLN[p%100-1]+' '+Math.floor(p/100):'Tidak diketahui';

/* ===== FILTER BERTINGKAT: Bulan → Distribusi → Area → Posko ===== */

/* ===== DAFTAR DATA DI BALIK SETIAP ANGKA ===== */
const uniqueRows=rows=>{const m=new Map();rows.forEach((r,i)=>{const k=r.NO_LAPORAN||'x'+i;if(!m.has(k))m.set(k,r)});return[...m.values()]};
const PK={
  wo:rows=>uniqueRows(rows),
  b:rows=>bcalc(rows).list,
  cm:rows=>bcalc(rows).list.filter(r=>btipe(gT(r))=='cm'),

  cc:rows=>bcalc(rows).list.filter(r=>btipe(gT(r))=='cc'),

  pm:rows=>bcalc(rows).list.filter(r=>btipe(gT(r))=='pm'),
  pmk:rows=>bcalc(rows).list.filter(r=>btipe(gT(r))=='pm'&&hasKet(gA(r))),
  ot:rows=>bcalc(rows).list.filter(r=>btipe(gT(r))=='ot')
};
const catList=j=>rows=>PK.cm(rows).filter(r=>bkat(gA(r))==j);
const grpBy=(rows,fn)=>{const m=new Map();rows.forEach(r=>{const k=String(fn(r)??'');if(!m.has(k))m.set(k,{k:[k],rows:[]});m.get(k).rows.push(r)});return[...m.values()].sort((a,b)=>a.k[0].localeCompare(b.k[0]))};

/* ===== RENDER ===== */
function render(){

    {t:'Batal by Command Center',v:i0(A.cm),s:i0(A.cmk)+' ada keterangan',c:'var(--c2)',fn:PK.cm,sfn:PK.cmk,ss:'ada keterangan'},
    {t:'Batal by Call Center',v:i0(A.cc),s:i0(A.cck)+' ada keterangan',c:'var(--c1)',fn:PK.cc,sfn:PK.cck,ss:'ada keterangan'},
    {t:'Batal by PLN Mobile',v:i0(A.pm),s:i0(A.pmk)+' ada keterangan',c:'var(--c3)',fn:PK.pm,sfn:PK.pmk,ss:'ada keterangan'}

  $('#j1').textContent='🚫 Rekapitulasi Laporan Batal';

  const vals=c=>[c.tot,c.b,c.tot?c.b/c.tot*100:null,c.cm,c.cmk,c.cc,c.cck,c.pm,c.pmk,c.ot];
  TB.t1={q:'#q1',el:'#t1',nk:1,
    head:[unit,'Total WO','Total WO Batal','% Batal','WO Batal','Ada Ket.','WO Batal','Ada Ket.','WO Batal','Ada Ket.','Tipe Lain / Kosong'],
    groups:[{l:'Command Center',c:[4,5]},{l:'Call Center',c:[6,7]},{l:'PLN Mobile',c:[8,9]}],
    kinds:[PK.wo,PK.b,PK.b,PK.cm,PK.cmk,PK.cc,PK.cck,PK.pm,PK.pmk,PK.ot],
    fmt:[i0,i0,pc,i0,i0,i0,i0,i0,i0,i0],cls:['','ng','ng','c1','c1','c2','c2','c3','c3',''],
    items:G.map(g=>{const c=bcalc(g.rows);return{cells:[...g.k,...vals(c)],rows:g.rows,list:c.list}}),
    tot:{l:`TOTAL (${G.length} ${unit})`,cells:vals(A)},allRows:rows,G:true,sc:null,sd:1};

  const cnt=rs=>{const a=Array(NC).fill(0);rs.forEach(r=>a[bkat(gA(r))]++);return a};
  const cmR=PK.cm(rows);
  TB.t2={q:'#q2',el:'#t2',nk:1,
    head:[unit,'Total Batal ComCen',...BCAT.map(c=>c[0])],
    kinds:[PK.cm,...BCAT.map((_,j)=>catList(j))],
    hr:[2],fmt:Array(NC+1).fill(i0),cls:['c1','rd',...Array(NC-1).fill('')],
    items:G.map(g=>{const cg=PK.cm(g.rows);return{cells:[...g.k,cg.length,...cnt(cg)],rows:g.rows,list:cg}}),
    tot:{l:`TOTAL (${G.length} ${unit})`,cells:[cmR.length,...cnt(cmR)]},allRows:rows,G:true,sc:null,sd:1};

}

const cv=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
function mk(id,cfg){if(CH[id])CH[id].destroy();if(typeof Chart=='undefined')return;CH[id]=new Chart($('#'+id),cfg)}
const PAL3=['#E3A857','#4FB6A8','#9B87C4','#E2665A','#6FBF96','#5AA9E6','#D98BB0','#B8C46B','#F28C38','#7FB3D5','#C0392B','#16A085','#8E44AD','#2E86C1','#AAB7B8'];
function shade(hex,a){const n=parseInt(hex.slice(1),16),r=n>>16,g=n>>8&255,b=n&255,f=v=>Math.max(0,Math.min(255,Math.round(a<0?v*(1+a):v+(255-v)*a)));return`rgb(${f(r)},${f(g)},${f(b)})`}
// kolom 3D buatan sendiri: bayangan lantai, sisi atas dan kanan, badan bergradasi
const bar3d={id:'bar3d',afterDatasetsDraw(ch){
  const cols=(ch.options.plugins.bar3d||{}).colors||[],m=ch.getDatasetMeta(0),ctx=ch.ctx;
  m.data.forEach((el,i)=>{
    const v=ch.data.datasets[0].data[i];if(!v)return;
    const p=el.getProps(['x','y','base','width'],true),c=cols[i%cols.length]||'#E3A857';
    const w=p.width,d=Math.max(5,Math.min(16,w*.35)),l=p.x-w/2,r=p.x+w/2,t=p.y,b=p.base;
    ctx.save();
    ctx.fillStyle='rgba(0,0,0,.22)';ctx.beginPath();ctx.ellipse(p.x+d/2,b+3,w/2+d,4,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=shade(c,-.38);ctx.beginPath();ctx.moveTo(r,t);ctx.lineTo(r+d,t-d);ctx.lineTo(r+d,b-d);ctx.lineTo(r,b);ctx.closePath();ctx.fill();
    ctx.fillStyle=shade(c,.4);ctx.beginPath();ctx.moveTo(l,t);ctx.lineTo(l+d,t-d);ctx.lineTo(r+d,t-d);ctx.lineTo(r,t);ctx.closePath();ctx.fill();
    const g=ctx.createLinearGradient(l,0,r,0);g.addColorStop(0,shade(c,.18));g.addColorStop(.5,c);g.addColorStop(1,shade(c,-.2));
    ctx.fillStyle=g;ctx.fillRect(l,t,w,b-t);
    ctx.fillStyle=cv('--tx');ctx.font="600 11px 'IBM Plex Mono',monospace";ctx.textAlign='center';ctx.textBaseline='bottom';
    ctx.fillText(i0(v),p.x+d/2,t-d-4);
    ctx.restore();
  });
}};

      scales:{x:{ticks:{color:tc,autoSkip:false,maxRotation:65,minRotation:45,font:{size:10}},grid:{display:false}},y:{beginAtZero:true,ticks:{color:tc},grid:{color:gc}}}},
    plugins:[bar3d]});

  const grad=c=>{const{chart:ch}=c;if(!ch.chartArea)return 'rgba(226,102,90,.25)';const g=ch.ctx.createLinearGradient(0,ch.chartArea.top,0,ch.chartArea.bottom);g.addColorStop(0,'rgba(226,102,90,.45)');g.addColorStop(1,'rgba(226,102,90,0)');return g};
  mk('c3',{type:'line',data:{labels:G.map(g=>g.k[0]),datasets:[{label:'WO Batal',data:vs.map(c=>c.b),borderColor:'#E2665A',borderWidth:3,pointRadius:5,pointHoverRadius:7,pointBackgroundColor:'#E2665A',pointBorderColor:'#fff',pointBorderWidth:2,tension:.35,fill:true,backgroundColor:grad}]},
    options:{responsive:true,maintainAspectRatio:false,layout:{padding:{top:10,right:10}},plugins:{legend:{display:false}},
      scales:{x:{ticks:{color:tc,autoSkip:false,maxRotation:60,minRotation:35,font:{size:10}},grid:{display:false}},y:{beginAtZero:true,ticks:{color:tc},grid:{color:gc}}}},
    plugins:[shadowLine]});
}

/* ===== TABEL ===== */
function drawT(t){
  const q=($(t.q).value||'').toLowerCase();
  let rs=t.items.filter(it=>!q||it.cells.slice(0,t.nk).join(' ').toLowerCase().includes(q));
  if(t.sc!=null)rs=[...rs].sort((a,b)=>{const x=a.cells[t.sc],y=b.cells[t.sc];return(typeof x=='string'?x.localeCompare(y):(x??-1)-(y??-1))*t.sd});
  const th=(c,label,a='')=>`<th data-c="${c}"${t.hr&&t.hr.includes(c)?' class="rd"':''} ${a}>${esc(label)} <i>${t.sc===c?(t.sd>0?'↑':'↓'):'⇅'}</i></th>`;
  let r1='',r2='';
  if(t.groups){
    for(let c=0;c<t.head.length;c++){
      const g=t.groups.find(g=>g.c[0]==c);
      if(g){r1+=`<th colspan="${g.c.length}">${esc(g.l)}</th>`;g.c.forEach(x=>r2+=th(x,t.head[x]))}
      else if(!t.groups.some(g=>g.c.includes(c)))r1+=th(c,t.head[c],'rowspan="2"');
    }
  }else r1=t.head.map((h,c)=>th(c,h)).join('');
  if(t.G)r1+=`<th${t.groups?' rowspan="2"':''}>Aksi</th>`;
  const cols=t.head.length+(t.G?1:0);
  const body=rs.length?rs.map(it=>{const idx=t.items.indexOf(it);return `<tr>${it.cells.map((v,c)=>c<t.nk?`<td class="k">${esc(v)}</td>`:`<td class="${t.cls[c-t.nk]||''} clk" data-i="${idx}" data-c="${c-t.nk}">${t.fmt[c-t.nk](v)}</td>`).join('')}${t.G?`<td><button class="rb" data-i="${idx}">👁 Rincian</button></td>`:''}</tr>`}).join('')
    :`<tr><td class="em" colspan="${cols}">Tidak ada data.</td></tr>`;
  const foot=t.tot?`<tfoot><tr><td class="k">${esc(t.tot.l)}</td>${t.tot.cells.map((v,c)=>`<td class="${t.cls[c]||''} clk" data-i="-1" data-c="${c}">${t.fmt[c](v)}</td>`).join('')}${t.G?'<td></td>':''}</tr></tfoot>`:'';
  $(t.el).innerHTML=`<table><thead><tr>${r1}</tr>${r2?`<tr>${r2}</tr>`:''}</thead><tbody>${body}</tbody>${foot}</table>`;
}

/* ===== RINCIAN (popup) ===== */
function openDetail(title,list){
  const rows=ticketRows(list),n=rows.length;
  $('#mt').textContent=`${title} — ${n} data`;
  const keys=rows[0]?Object.keys(rows[0]):['Keterangan'];
  $('#mb').innerHTML=`<div class="tw"><table style="min-width:1000px"><thead><tr>${keys.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>`+
    (n?rows.slice(0,300).map(o=>`<tr>${keys.map(x=>`<td class="${x=='Kategori Batal'&&o[x]==BCAT[0][0]?'rd':''}" style="text-align:left">${esc(o[x])}</td>`).join('')}</tr>`).join('')
      :`<tr><td class="em" colspan="${keys.length}">Tidak ada data.</td></tr>`)+'</tbody></table></div>'+(n>300?'<p class="stat">Menampilkan 300 pertama; Excel berisi seluruh data.</p>':'');
  MX={file:'Rincian_'+slug(title),rows};
  $('#ov').classList.add('on');
}

/* ===== EXPORT EXCEL ===== */
function saveXlsx(sheets,name){
  const wb=XLSX.utils.book_new();
  sheets.forEach(s=>XLSX.utils.book_append_sheet(wb,s.ws,s.name));
  XLSX.writeFile(wb,name+'_'+new Date().toISOString().slice(0,10)+'.xlsx');
}
function exportT(id,mode){
  const t=TB[id];if(!t||!t.items.length){toast('Tidak ada data untuk diexport',true);return}
  if(mode=='rekap'){
    const top=t.groups?t.head.map((h,c)=>{const g=t.groups.find(g=>g.c.includes(c));return g?g.l:''}):null;
    const aoa=[...(top?[top]:[]),t.head,...t.items.map(it=>it.cells),[t.tot.l,...t.tot.cells]];
    saveXlsx([{name:'Rekap',ws:XLSX.utils.aoa_to_sheet(aoa)}],id=='t1'?'Rekap_Laporan_Batal':'Kategori_Batal_Comcen');
  }else{
    const rows=ticketRows(t.allRows.length?(id=='t1'?PK.b(t.allRows):PK.cm(t.allRows)):[]);
    if(!rows.length){toast('Tidak ada tiket batal',true);return}
    saveXlsx([{name:'Detail Tiket',ws:XLSX.utils.json_to_sheet(rows)}],id=='t1'?'Detail_Laporan_Batal':'Detail_Kategori_Batal_Comcen');
  }
}

/* ===== EVENT ===== */
$('#fb').onchange=fillAll;
$('#fd').onchange=()=>{fillArea();fillPos();readF();render()};
$('#fa').onchange=()=>{const a=$('#fa').value,d=$('#fd').value;
  if(a){const r=mrows().find(x=>x.NAMA_AREA==a&&(!d||x.NAMA_DISTRIBUSI==d));if(r)$('#fd').value=r.NAMA_DISTRIBUSI}
  fillAll()};
$('#fp').onchange=()=>{const p=$('#fp').value,a=$('#fa').value,d=$('#fd').value;
  if(p){const r=mrows().find(x=>x.NAMA_POSKO==p&&(!a||x.NAMA_AREA==a)&&(!d||x.NAMA_DISTRIBUSI==d));if(r){$('#fd').value=r.NAMA_DISTRIBUSI;$('#fa').value=r.NAMA_AREA}}
  fillAll()};
$('#rs').onclick=()=>{$('#fd').value='';$('#fa').value='';$('#fp').value='';fillAll()};
$('#sy').onclick=sync;
$('#q1').oninput=()=>drawT(TB.t1);$('#q2').oninput=()=>drawT(TB.t2);
document.querySelectorAll('button[data-x]').forEach(b=>b.onclick=()=>exportT(b.dataset.x,b.dataset.m));
['t1','t2'].forEach(id=>$('#'+id).addEventListener('click',e=>{
  const t=TB[id];if(!t)return;
  const th=e.target.closest('th[data-c]');
  if(th){const c=+th.dataset.c;t.sd=t.sc==c?-t.sd:1;t.sc=c;drawT(t);return}
  const td=e.target.closest('td.clk');
  if(td){
    const i=+td.dataset.i,c=+td.dataset.c,it=i<0?null:t.items[i];
    const title=(it?it.cells[0]:t.tot.l)+' — '+t.head[t.nk+c];
    openDetail(title,t.kinds[c](it?it.rows:t.allRows));
    return;
  }
  const b=e.target.closest('.rb');
  if(b){const it=t.items[+b.dataset.i];openDetail(it.cells[0],it.list)}
}));
$('#kp').addEventListener('click',e=>{
  const el=e.target.closest('[data-k]');if(!el)return;
  const k=KPI[+el.dataset.k],sub=el.hasAttribute('data-s');
  openDetail(k.t+(sub?' — '+k.ss:''),(sub?k.sfn:k.fn)(k.rows));
});
$('#mc').onclick=()=>$('#ov').classList.remove('on');
$('#ov').addEventListener('click',e=>{if(e.target.id=='ov')$('#ov').classList.remove('on')});
document.addEventListener('keydown',e=>{if(e.key=='Escape')$('#ov').classList.remove('on')});
$('#mx').onclick=()=>{if(MX&&MX.rows.length)saveXlsx([{name:'Rincian Tiket Batal',ws:XLSX.utils.json_to_sheet(MX.rows)}],MX.file);else toast('Tidak ada data untuk diexport',true)};

function theme(t){document.documentElement.dataset.theme=t;try{localStorage.setItem('wo-batal-tema',t)}catch(e){}if(D.p2b.length)render()}
$('#th').onclick=()=>theme(document.documentElement.dataset.theme=='light'?'dark':'light');
try{document.documentElement.dataset.theme=localStorage.getItem('wo-batal-tema')||'dark'}catch(e){}

fillAll();
boot();
setInterval(()=>{if(!document.hidden)sync()},AUTO_MS);
</script>
