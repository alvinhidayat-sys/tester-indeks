html[data-theme="dark"] .tr-kpi.on{box-shadow:0 0 18px rgba(255,168,74,.35)}
.tr-kl{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;opacity:.75}

@media (min-width:768px) and (max-width:1439px){.mnu-btn{padding:.625rem .5rem !important;font-size:.78rem !important;gap:.3rem !important}.mnu-btn svg{width:.85rem;height:.85rem}}
.tr-arrow{opacity:.45;font-weight:400;font-size:.85rem}
.tr-vA{color:var(--trA)}.tr-vB{color:var(--trB)}
.tr-chip{display:inline-block;font-size:.66rem;font-weight:700;padding:.12rem .5rem;border-radius:999px;white-space:nowrap}
.tr-up{color:#b3321f;background:rgba(231,76,60,.14)}.tr-down{color:#17794a;background:rgba(46,204,113,.18)}.tr-flat{color:#6b6477;background:rgba(148,163,184,.2)}.tr-warn{color:#9a5410;background:rgba(245,154,60,.2)}
html[data-theme="dark"] .tr-up{color:#ff9a8f;background:rgba(231,76,60,.2)}html[data-theme="dark"] .tr-down{color:#7be0ac;background:rgba(46,204,113,.2)}html[data-theme="dark"] .tr-flat{color:#b4bad0}html[data-theme="dark"] .tr-warn{color:#ffc98f}
.tr-verdict{display:flex;align-items:center;gap:1rem;padding:1rem 1.25rem;border-radius:1rem;margin-bottom:1rem;border:1px solid transparent;border-left-width:8px}
.tr-verdict .tr-vic{font-size:2rem;line-height:1;flex:none}.tr-verdict .tr-vlb{font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.8}
.tr-verdict .tr-vt{font-size:1.75rem;font-weight:800;line-height:1.15;margin:.1rem 0 .3rem}.tr-verdict .tr-vs{font-size:.78rem;line-height:1.45;opacity:.9}

.tr-verdict.tr-up{border-color:rgba(231,76,60,.45);border-left-color:#e74c3c}.tr-verdict.tr-down{border-color:rgba(46,204,113,.45);border-left-color:#2ecc71}.tr-verdict.tr-flat{border-color:rgba(148,163,184,.5);border-left-color:#94a3b8}.tr-verdict.tr-warn{border-color:rgba(245,154,60,.5);border-left-color:#f59a3c}
.tr-tg{display:inline-flex;align-items:center;gap:.35rem;font-size:.72rem;font-weight:600;cursor:pointer;padding:.3rem .6rem;border:1px solid rgba(148,163,184,.4);border-radius:.6rem}
.tr-tg.off{opacity:.45;cursor:not-allowed}
.tr-svg{display:block;touch-action:pan-y;overflow:visible}
.tr-g{stroke:var(--trgrid);stroke-dasharray:3 4;stroke-width:1}
.tr-t{fill:var(--trtx);font-size:11px}
.tr-line{stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:trdraw .9s ease forwards}
.tr-lineA{stroke:var(--trA)}.tr-lineB{stroke:var(--trB)}
.tr-ptA{fill:var(--trA);stroke:#fff;stroke-width:1.2}.tr-ptB{fill:var(--trB);stroke:#fff;stroke-width:1.2}
html[data-theme="dark"] .tr-ptA,html[data-theme="dark"] .tr-ptB{stroke:#12162a}
.tr-big{stroke-width:2}
.tr-cross{stroke:var(--trtx);stroke-dasharray:4 4;opacity:.7}
.tr-fade{opacity:0;animation:trfade .9s .2s ease forwards}
@keyframes trdraw{to{stroke-dashoffset:0}}
@keyframes trfade{to{opacity:1}}
.tr-tip{position:absolute;transform:translateX(-50%);pointer-events:none;background:rgba(28,18,44,.94);color:#fff;border:1px solid rgba(255,255,255,.14);border-radius:.7rem;padding:.45rem .7rem;font-size:.72rem;line-height:1.5;white-space:nowrap;z-index:5;box-shadow:0 10px 24px -10px rgba(0,0,0,.7)}

.tr-lg{display:inline-flex;align-items:center}
@media (prefers-reduced-motion:reduce){.tr-line,.tr-fade{animation:none;stroke-dashoffset:0;opacity:1}}

.lap-sheet .tr-t{fill:#444}.lap-sheet .tr-g{stroke:#cfcfcf}.lap-sheet .tr-svg{max-height:75mm}.lap-sheet .tr-lg,.lap-sheet .lap-chart{color:#111}

@page{size:A4;margin:14mm 12mm 18mm}

 html,html[data-theme] body.lap-printing,body.lap-printing{background:#fff !important;background-image:none !important}

.pp-x{width:2rem;height:2rem;border-radius:.6rem;font-size:1.4rem;line-height:1;color:#fff;background:rgba(255,255,255,.12);cursor:pointer}
.pp-x:hover{background:rgba(255,255,255,.25)}
.pp-bd{padding:1.2rem 1.3rem;overflow:auto;display:flex;flex-direction:column;gap:.9rem}
.pp-g{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.8rem}
@media(max-width:560px){.pp-g{grid-template-columns:1fr}}
.pp-lb{display:block;font-size:.72rem;font-weight:700;color:#475569;margin-bottom:.25rem}
.pp-sel{width:100%;background:#f8fafc;border:1px solid #cbd5e1;border-radius:.7rem;padding:.5rem .7rem;font-size:.8rem;color:#1b2437;cursor:pointer}
.pp-sm{font-size:.72rem;color:#64748b;line-height:1.35}
.pp-note{font-size:.74rem;background:#fff7e6;border:1px solid #f5d59a;color:#7a4a00;border-radius:.7rem;padding:.55rem .75rem}
.pp-box2{border:1px solid #e2e8f0;border-radius:.8rem;padding:.8rem .9rem;background:#f8fafc;display:flex;flex-direction:column;gap:.55rem}
.pp-bt{font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:#475569}
.pp-row{display:flex;gap:.6rem;align-items:flex-start;font-size:.8rem}
.pp-dot{width:.65rem;height:.65rem;border-radius:999px;margin-top:.3rem;flex:none}
.pp-err{font-size:.78rem;background:#fef2f2;border:1px solid #fecaca;color:#991b1b;border-radius:.7rem;padding:.55rem .75rem}
.pp-ok{font-size:.78rem;background:#ecfdf5;border:1px solid #a7f3d0;color:#065f46;border-radius:.7rem;padding:.55rem .75rem}
.pp-ft{display:flex;justify-content:flex-end;gap:.6rem;padding:.9rem 1.3rem;border-top:1px solid #e2e8f0;background:#fff}
.pp-b1,.pp-b2{height:2.4rem;padding:0 1.2rem;border-radius:.7rem;font-size:.8rem;font-weight:700;cursor:pointer}
.pp-b1{background:linear-gradient(135deg,#f5a623,#e0762a);color:#2a1300}
.pp-b1:disabled{opacity:.5;cursor:not-allowed}
.pp-b2{background:#f1f5f9;color:#334155;border:1px solid #cbd5e1}
[data-theme=dark] .pp-box{background:#141a2e;color:#e5e9f5;border-color:#2a3350}
[data-theme=dark] .pp-sel{background:#0e1424;color:#e5e9f5;border-color:#2f3a5c}
[data-theme=dark] .pp-lb,[data-theme=dark] .pp-bt{color:#a9b4d0}
[data-theme=dark] .pp-sm{color:#94a3c4}
[data-theme=dark] .pp-box2{background:#0e1424;border-color:#2a3350}
[data-theme=dark] .pp-ft{background:#141a2e;border-color:#2a3350}
[data-theme=dark] .pp-b2{background:#1c2540;color:#d6dcef;border-color:#2f3a5c}
</style>
<style id="fgtm-css">
/* ===== REKAP FGTM + FILTER CHECKLIST ===== */
:root{--fgh:#ffb9b9;--fght:#4a1414;--fgbd:#cdb8a4;--fgtx:#2c2236;--fgsum:rgba(148,163,184,.22);--fgpop:#fffaf2;--fgpopbd:#d9c7b2;--fgacc:#b0561a;--fgsoft:rgba(224,118,42,.14)}
html[data-theme="dark"]{--fgh:#5d2c3c;--fght:#ffdbe0;--fgbd:#394067;--fgtx:#e6e9f5;--fgsum:rgba(148,163,184,.16);--fgpop:#1c2140;--fgpopbd:#3a4266;--fgacc:#ffa84a;--fgsoft:rgba(255,168,74,.16)}
.fg-ms{position:relative;width:100%}
.fg-ms-btn{text-align:left;display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.fg-ms-lb{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fg-ms-on{border-color:var(--fgacc) !important;box-shadow:0 0 0 2px var(--fgsoft)}
.fg-pop{position:absolute;left:0;top:calc(100% + .3rem);z-index:60;min-width:15rem;max-width:min(20rem,86vw);background:var(--fgpop);color:var(--fgtx);border:1px solid var(--fgpopbd);border-radius:.85rem;box-shadow:0 14px 34px rgba(30,20,50,.28);padding:.5rem}
.fg-pop-r{left:auto;right:0}
.fg-pop-h{display:flex;align-items:center;justify-content:space-between;gap:.5rem;padding:.15rem .25rem .45rem;border-bottom:1px solid var(--fgpopbd);margin-bottom:.35rem}
.fg-lnk{font-size:.72rem;font-weight:700;color:var(--fgacc);background:none;border:0;cursor:pointer;padding:.1rem .2rem}
.fg-lnk:hover{text-decoration:underline}
.fg-pop-c{font-size:.68rem;opacity:.7}
.fg-q{width:100%;font-size:.78rem;padding:.35rem .55rem;border-radius:.6rem;border:1px solid var(--fgpopbd);background:transparent;color:inherit;margin-bottom:.35rem}
.fg-pop-l{max-height:15rem;overflow-y:auto}
.fg-ck{display:flex;align-items:center;gap:.5rem;padding:.38rem .4rem;border-radius:.5rem;font-size:.8rem;cursor:pointer;user-select:none}
.fg-ck:hover{background:var(--fgsoft)}
.fg-ck input{width:1rem;height:1rem;accent-color:#b0561a;flex-shrink:0}
.fg-empty{font-size:.78rem;opacity:.65;padding:.5rem}
.fg-menu{min-width:17rem;padding:.35rem}
.fg-mi{display:flex;flex-direction:column;align-items:flex-start;gap:.1rem;width:100%;text-align:left;padding:.55rem .65rem;border-radius:.6rem;border:0;background:none;color:inherit;cursor:pointer}
.fg-mi:hover{background:var(--fgsoft)}
.fg-mi b{font-size:.82rem}.fg-mi span{font-size:.7rem;opacity:.7}
.fg-xbtn:disabled{opacity:.45;cursor:not-allowed}
.fg-tg-on{border-color:var(--fgacc);color:var(--fgacc)}
.fg-chips{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.9rem}
.fg-chip{display:inline-flex;align-items:center;gap:.45rem;font-size:.72rem;font-weight:600;padding:.3rem .65rem;border-radius:999px;border:1px solid rgba(148,163,184,.45);background:rgba(148,163,184,.1);color:inherit;cursor:pointer;transition:border-color .15s,transform .1s}
.fg-chip:not(:disabled):hover{transform:translateY(-1px);border-color:var(--fgacc)}
.fg-chip:disabled{cursor:default;opacity:.55}
.fg-chip-n{font-weight:800;font-size:.8rem}
.fg-c-ok{background:rgba(46,204,113,.16);border-color:rgba(46,204,113,.5)}
.fg-c-x{background:rgba(245,154,60,.16);border-color:rgba(245,154,60,.5)}
.fg-c-d{background:rgba(122,61,159,.14);border-color:rgba(122,61,159,.45)}
.fg-rule{margin-top:.7rem;font-size:.74rem;opacity:.9}
.fg-rule summary{cursor:pointer;font-weight:700;color:var(--fgacc)}
.fg-rule ul{margin:.4rem 0 0 1.1rem;list-style:disc;display:grid;gap:.2rem}
.fg-none{margin-top:1rem;padding:1.4rem;text-align:center;font-size:.85rem;border:1px dashed rgba(148,163,184,.55);border-radius:.85rem;opacity:.85}
.fg-sec{font-size:.8rem;font-weight:800;margin-bottom:.4rem;letter-spacing:.02em}
.fg-wrap{overflow-x:auto;border-radius:.7rem;-webkit-overflow-scrolling:touch}
.fg-t{border-collapse:collapse;width:100%;min-width:720px;font-size:.78rem;color:var(--fgtx)}
.fg-t th,.fg-t td{border:1px solid var(--fgbd);padding:.32rem .5rem;text-align:center;vertical-align:middle}
.fg-t th{background:var(--fgh);color:var(--fght);font-weight:800;font-size:.7rem;letter-spacing:.02em}
.fg-t td.l{text-align:left}
.fg-t td.nw{white-space:nowrap}
.fg-t tr.fg-idx td{background:var(--fgh);color:var(--fght);font-style:italic;font-size:.64rem;padding:.08rem .3rem}
.fg-t tr.fg-sum td{background:var(--fgsum);font-weight:800}
.fg-t td.fg-u{font-weight:700}
.fg-up3{font-size:.62rem;font-weight:500;opacity:.7}
.fg-t td.fg-re,.fg-t td.fg-jm{font-weight:800}
.fg-num{font-weight:800;min-width:1.7rem;padding:.12rem .4rem;border-radius:.45rem;border:0;background:var(--fgsoft);color:var(--fgacc);cursor:pointer;text-decoration:underline dotted;text-underline-offset:2px;transition:background-color .12s,transform .1s}
.fg-num:hover{background:var(--fgacc);color:#fff;text-decoration:none;transform:scale(1.06)}
.fg-tg{width:3.7rem;text-align:center;font-weight:800;border:1px solid var(--fgbd);border-radius:.45rem;background:transparent;color:inherit;padding:.15rem}
.fg-tg::placeholder{opacity:.45}
.fg-ov{position:fixed;inset:0;z-index:70;background:rgba(15,12,30,.62);display:flex;align-items:center;justify-content:center;padding:.75rem}
.fg-md{width:min(1180px,100%);max-height:92vh;display:flex;flex-direction:column;background:var(--fgpop);color:var(--fgtx);border:1px solid var(--fgpopbd);border-radius:1.1rem;box-shadow:0 24px 60px rgba(0,0,0,.45)}
.fg-md-h{display:flex;align-items:flex-start;justify-content:space-between;gap:.75rem;padding:.9rem 1.1rem;border-bottom:1px solid var(--fgpopbd)}
.fg-md-t{font-size:.95rem;font-weight:800;overflow-wrap:anywhere}
.fg-md-s{font-size:.72rem;opacity:.7;margin-top:.15rem}
.fg-md-a{display:flex;align-items:center;gap:.5rem;flex-shrink:0}
.fg-x{width:2rem;height:2rem;border-radius:.6rem;border:1px solid var(--fgpopbd);background:transparent;color:inherit;font-size:1.25rem;line-height:1;cursor:pointer}
.fg-x:hover{background:var(--fgsoft)}
.fg-md-b{padding:.8rem 1.1rem 1.1rem;overflow:auto}
.fg-dt{min-width:1020px}
.fg-dt td{font-size:.74rem}
.fg-dt .fg-ket{min-width:11rem;max-width:22rem}
.fg-dt tr.fg-skip td{background:rgba(245,154,60,.1)}
.fg-dt .fg-warn{color:var(--fgacc);font-weight:600}
@media (max-width:639px){.fg-md{max-height:96vh;border-radius:.9rem}.fg-md-h{flex-direction:column}.fg-pop{min-width:13.5rem}}

/* ===== "Memuat data...." (proses sinkron) ===== */
.ld-t{color:#dc2626;font-weight:700;font-size:11px;line-height:1.3;white-space:nowrap;letter-spacing:0;text-transform:none}
.ld-dots i{font-style:normal;display:inline-block;animation:ld-jump 1.1s infinite ease-in-out}
.ld-dots i:nth-child(2){animation-delay:.15s}.ld-dots i:nth-child(3){animation-delay:.3s}.ld-dots i:nth-child(4){animation-delay:.45s}
@keyframes ld-jump{0%,70%,100%{opacity:.25;transform:translateY(0)}35%{opacity:1;transform:translateY(-3px)}}
.ld-pill{background:#fff;padding:2px 9px;border-radius:9999px;box-shadow:0 1px 3px rgba(0,0,0,.18)}
.ld-blk{position:relative}
.ld-blk-on>:not(.ld-blk-v){opacity:.45;pointer-events:none}
.ld-blk-v{position:absolute;left:0;right:0;top:0;display:flex;justify-content:center;padding-top:64px;z-index:5;pointer-events:none}
.fg-ldc{padding:22px 8px!important;text-align:center!important}
@media (prefers-reduced-motion:reduce){.ld-dots i{animation:none;opacity:1}}
