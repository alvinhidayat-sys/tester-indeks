<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rekap Pekerjaan SCADA & Telekomunikasi</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{--bg:#f4f7fb;--c:#fff;--t:#1b2a3a;--p:#0b6fa4;--b:#d8e2ec}
@media(prefers-color-scheme:dark){:root{--bg:#10171f;--c:#18222d;--t:#e6edf4;--p:#4aa8d8;--b:#2b3a49}}
*{box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif;background:var(--bg);color:var(--t)}
header{background:var(--p);color:#fff;padding:14px 18px;font-size:18px;font-weight:600}
main{max-width:1100px;margin:auto;padding:14px}
.card{background:var(--c);border:1px solid var(--b);border-radius:10px;padding:12px;margin-bottom:12px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
label{display:flex;flex-direction:column;font-size:12px;gap:3px}
select,input,button{font:inherit;padding:7px 10px;border:1px solid var(--b);border-radius:6px;background:var(--c);color:var(--t)}
button{background:var(--p);color:#fff;border:0;cursor:pointer}button.s{background:#5b6b7b}button:disabled{opacity:.5}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{padding:7px 9px;border-bottom:1px solid var(--b);text-align:left;vertical-align:top}
th{background:var(--p);color:#fff;white-space:nowrap}td button{padding:4px 8px}
#modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:12px;z-index:9}
#mb{background:var(--c);border-radius:10px;max-width:760px;width:100%;max-height:90vh;overflow:auto;padding:14px}
#st{font-size:12px;opacity:.8;margin:6px 0}.x{display:none}
</style></head><body>
<header>Rekap Pekerjaan Pemeliharaan — SCADA & Telekomunikasi</header>
<main>
<div class="card"><div class="row">
<label>Pekerjaan<select id="job"><option value="scada">SCADA</option><option value="tel">Telekomunikasi</option></select></label>
<label>Tahun<select id="yr"></select></label>
<label>Bulan<select id="mo"></select></label>
<button id="go">Tampilkan</button>
<button class="s" onclick="cfg.hidden=!cfg.hidden">Pengaturan</button>
</div>
<div id="cfg" hidden style="margin-top:10px">
<div class="row">
<label>Google API Key (Drive API aktif, untuk daftar & unduh foto)<input id="key" size="40"></label>
<label>ID Folder Foto SCADA<input id="fs" size="38" value="1vdFBNUYJgRlspEfalwOmnnyA5wE_bM0-"></label>
<label>ID Folder Foto Telekomunikasi<input id="ft" size="38" placeholder="menyusul"></label>
<button class="s" onclick="saveCfg()">Simpan</button></div>
<div style="font-size:12px;margin-top:6px">Spreadsheet & folder harus dibagikan "Siapa saja yang memiliki link".</div></div></div>
<div id="st"></div>
<div class="card">
<div class="row" style="margin-bottom:8px">
<button id="bx" disabled>Export Tabel Foto (Excel)</button>
<button id="bd" disabled>Download Semua Foto (ZIP)</button></div>
<div class="tw"><table><thead><tr><th>No</th><th>Tanggal</th><th>Remote Station</th><th>Jenis Pemeliharaan</th><th>Lihat Laporan</th></tr></thead><tbody id="tb"></tbody></table></div></div>
</main>
<div id="modal"><div id="mb"></div></div>
<script>
const SID='1aw4pLkidxYOiwWpYZE47wBqjWBUnuZIRkvJIcQVEl-0';
const SRC={scada:{gid:'1654147482',photo:/pembersihan|panel/i,col:9,name:'SCADA'},tel:{gid:'597556611',photo:/instalasi/i,col:29,name:'Telekomunikasi'}};
const BLN=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const $=id=>document.getElementById(id);
let cache={},rows=[],drive={};
const st=m=>$('st').textContent=m;
// pengaturan
// ====== ISI DI SINI AGAR OTOMATIS ======
const DEF={key:'',fs:'1vdFBNUYJgRlspEfalwOmnnyA5wE_bM0-',ft:'',proxy:'https://script.google.com/macros/s/AKfycbxm8ZFgJbZtgFTea0JklhNgp-kkoIB4w9u2QmEN4mCT6uWqPVs3xcAcWHvdZ8NYJurE/exec'}; // proxy = URL Web App Apps Script (/exec), kosongkan jika pakai API Key
// =======================================
['key','fs','ft'].forEach(k=>{if(DEF[k])$(k).value=DEF[k]});
try{const c=JSON.parse(localStorage.getItem('cfg')||'{}');['key','fs','ft'].forEach(k=>{if(c[k]&&!DEF[k])$(k).value=c[k]})}catch(e){}
if(DEF.key||DEF.proxy)$('cfg').hidden=true;
function saveCfg(){try{localStorage.setItem('cfg',JSON.stringify({key:$('key').value,fs:$('fs').value,ft:$('ft').value}))}catch(e){}drive={};st('Pengaturan disimpan')}
const y0=new Date().getFullYear();
$('yr').innerHTML=[y0-2,y0-1,y0,y0+1].map(y=>`<option ${y==y0?'selected':''}>${y}</option>`).join('');
$('mo').innerHTML='<option value="0">Semua</option>'+BLN.map((b,i)=>`<option value="${i+1}" ${i==new Date().getMonth()?'selected':''}>${b}</option>`).join('');
// CSV parser
function csv(t){const r=[];let a=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];
if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}
else if(c=='"')q=true;else if(c==','){a.push(f);f=''}
else if(c=='\n'){a.push(f);r.push(a);a=[];f=''}else if(c!='\r')f+=c}
if(f||a.length){a.push(f);r.push(a)}return r}
function pdate(s){s=(s||'').trim();let m;
if(m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})/))return new Date(+m[3],m[2]-1,+m[1]);
if(m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))return new Date(+m[1],m[2]-1,+m[3]);
if(m=s.match(/^(\d{1,2})\s+([A-Za-z]+)\s+(\d{4})/)){const i=BLN.findIndex(b=>b.toLowerCase().startsWith(m[2].toLowerCase().slice(0,3)));if(i>=0)return new Date(+m[3],i,+m[1])}
return null}
const fmt=d=>String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear();
const fn=d=>String(d.getDate()).padStart(2,'0')+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+d.getFullYear();
async function load(k){
if(cache[k])return cache[k];
const u=`https://docs.google.com/spreadsheets/d/${SID}/gviz/tq?tqx=out:csv&gid=${SRC[k].gid}`;
const r=await fetch(u);if(!r.ok)throw new Error('Gagal membaca spreadsheet (pastikan akses link publik)');
const all=csv(await r.text());
let h=all.findIndex(x=>x.some(c=>/tanggal/i.test(c)));if(h<0)h=0;
const hd=all[h].map((c,i)=>(c||'').trim()||('Kolom '+(i+1)));
const find=re=>hd.findIndex(c=>re.test(c));
const ix={d:find(/tanggal/i),n:find(/remote station|repeater|nama aset|nama asset|lokasi|nama/i),j:find(/jenis/i)};
let pc=hd.findIndex(c=>SRC[k].photo.test(c));if(pc<0)pc=SRC[k].col;
const data=all.slice(h+1).map(r=>({r,date:pdate(r[ix.d])})).filter(o=>o.date).map(o=>({
date:o.date,name:(o.r[ix.n]||'').trim(),jenis:(o.r[ix.j]||'').trim(),photo:(o.r[pc]||'').trim(),
f:hd.map((c,i)=>[c,(o.r[i]||'').trim()]).filter(x=>x[1])}));
return cache[k]={hd,data,pc}}
// Drive
async function listDrive(id,key){
if(DEF.proxy){const r=await fetch(`${DEF.proxy}?action=list&id=${id}`);if(!r.ok)throw new Error('Gagal menghubungi Apps Script');const j=await r.json();if(j.error)throw new Error(j.error);return j}
const out=[];const q=[id];
while(q.length){const p=q.shift();let tok='';
do{const u=`https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(`'${p}' in parents and trashed=false`)}&fields=nextPageToken,files(id,name,mimeType)&pageSize=1000&key=${key}`+(tok?`&pageToken=${tok}`:'');
const r=await fetch(u);if(!r.ok)throw new Error('Gagal membaca folder Drive (cek API Key & akses folder)');
const j=await r.json();tok=j.nextPageToken||'';
j.files.forEach(f=>f.mimeType=='application/vnd.google-apps.folder'?q.push(f.id):out.push(f))}while(tok)}
return out}
async function getDrive(k){
const id=$(k=='scada'?'fs':'ft').value.trim(),key=$('key').value.trim();
if(!id)throw new Error('ID folder foto '+SRC[k].name+' belum diisi (Pengaturan)');
if(!key&&!DEF.proxy)throw new Error('Isi Google API Key di Pengaturan untuk mengakses foto');
return drive[k]||(drive[k]=await listDrive(id,key))}
const base=s=>s.toLowerCase().replace(/\.[a-z0-9]{2,4}$/,'').trim();
const issign=s=>/sign|ttd|tanda.?tangan/i.test(s);
function names(o){return o.photo.split(/[\n,;]+/).map(s=>s.trim()).filter(Boolean)}
function match(o,files,noSign=true){
return names(o).filter(n=>!(noSign&&issign(n))).map(n=>({n,f:files.find(f=>f.name.toLowerCase()==n.toLowerCase())||files.find(f=>base(f.name)==base(n))}))}
// tabel
async function show(){
try{st('Memuat data...');const k=$('job').value,{data}=await load(k);
const y=+$('yr').value,m=+$('mo').value;
rows=data.filter(o=>o.date.getFullYear()==y&&(!m||o.date.getMonth()+1==m)).sort((a,b)=>a.date-b.date);
$('tb').innerHTML=rows.map((o,i)=>`<tr><td>${i+1}</td><td>${fmt(o.date)}</td><td>${esc(o.name)}</td><td>${esc(o.jenis)}</td><td><button onclick="detail(${i})" title="Lihat laporan">👁</button></td></tr>`).join('')||'<tr><td colspan=5>Tidak ada data</td></tr>';
$('bx').disabled=$('bd').disabled=!rows.length;st(rows.length+' pekerjaan ditemukan')}
catch(e){st('Error: '+e.message)}}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
$('go').onclick=show;
// detail
let cur=null;
function detail(i){cur=rows[i];
$('mb').innerHTML=`<h3 style="margin-top:0">Laporan ${esc(cur.name)} — ${fmt(cur.date)}</h3>
<div class="tw"><table>${cur.f.map(x=>`<tr><th style="background:none;color:inherit;width:35%">${esc(x[0])}</th><td>${esc(x[1])}</td></tr>`).join('')}</table></div>
<div class="row" style="margin-top:10px"><button onclick="dx()">Export Excel</button><button onclick="dp()">Export PDF</button>
<button onclick="dz()">Export Dokumentasi (non-sign)</button><button class="s" onclick="$('modal').style.display='none'">Tutup</button></div>`;
$('modal').style.display='flex'}
$('modal').onclick=e=>{if(e.target.id=='modal')e.target.style.display='none'};
const safe=s=>s.replace(/[\\/:*?"<>|]+/g,'_').replace(/\s+/g,'_');
function dx(){const ws=XLSX.utils.aoa_to_sheet([['Item','Isi'],...cur.f]);ws['!cols']=[{wch:40},{wch:60}];const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Laporan');XLSX.writeFile(wb,`Laporan_${fn(cur.date)}_${safe(cur.name)}.xlsx`)}
function dp(){const d=new jspdf.jsPDF();d.setFontSize(13);d.text(`Laporan ${cur.name} - ${fmt(cur.date)}`,14,15);
d.autoTable({startY:22,head:[['Item','Isi']],body:cur.f,styles:{fontSize:9},columnStyles:{0:{cellWidth:60}}});d.save(`Laporan_${fn(cur.date)}_${safe(cur.name)}.pdf`)}
async function blob(f){
if(DEF.proxy){const r=await fetch(`${DEF.proxy}?action=file&id=${f.id}`);const j=await r.json();if(j.error)throw new Error(j.error);const b=atob(j.data),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return new Blob([u],{type:j.mime})}
const r=await fetch(`https://www.googleapis.com/drive/v3/files/${f.id}?alt=media&key=${$('key').value.trim()}`);if(!r.ok)throw new Error('Unduh gagal: '+f.name);return r.blob()}
const ext=n=>(n.match(/\.[a-z0-9]{2,4}$/i)||['.jpg'])[0];
async function zip(list,fname){
const k=$('job').value;const files=await getDrive(k);const z=new JSZip();let c=0,miss=0;
for(const o of list){const ms=match(o,files);let n=0;
for(const m of ms){if(!m.f){miss++;continue}n++;st(`Mengunduh ${++c}...`);
z.file(`${fn(o.date)}_${safe(o.name)}${ms.length>1?'_'+n:''}${ext(m.f.name)}`,await blob(m.f))}}
if(!c){st('Tidak ada foto yang cocok di Drive');return}
const b=await z.generateAsync({type:'blob'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=fname;a.click();
st(`${c} foto diunduh${miss?`, ${miss} tidak ditemukan di Drive`:''}`)}
async function dz(){try{await zip([cur],`Dokumentasi_${fn(cur.date)}_${safe(cur.name)}.zip`)}catch(e){st('Error: '+e.message)}}
$('bd').onclick=async()=>{try{await zip(rows,`Foto_${SRC[$('job').value].name}_${$('yr').value}_${$('mo').value}.zip`)}catch(e){st('Error: '+e.message)}};
$('bx').onclick=async()=>{try{const k=$('job').value;const files=await getDrive(k);const out=[['No','Tanggal','Remote Station','Jenis Pemeliharaan','Nama File di Sheet','Nama File di Drive','Status']];let n=0;
rows.forEach(o=>match(o,files,false).forEach(m=>out.push([++n,fmt(o.date),o.name,o.jenis,m.n,m.f?m.f.name:'-',m.f?'Ditemukan':'Tidak ditemukan'])));
const ws=XLSX.utils.aoa_to_sheet(out);ws['!cols']=[5,12,28,26,34,34,16].map(w=>({wch:w}));const wb=XLSX.utils.book_new();
XLSX.utils.book_append_sheet(wb,ws,k=='scada'?'Foto Pembersihan Panel':'Foto Instalasi');
XLSX.writeFile(wb,`Tabel_Foto_${SRC[k].name}_${$('yr').value}_${$('mo').value}.xlsx`);st('Excel dibuat')}catch(e){st('Error: '+e.message)}};
show();
</script></body></html>
