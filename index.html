</style></head><body>
<header><div class="hero" id="hr"><video id="hv" src="journey.mp4" poster="journey-poster.jpg" autoplay muted loop playsinline preload="auto" disablepictureinpicture disableremoteplayback aria-hidden="true" tabindex="-1"></video></div><div class="brand"><b id="bt">Command Center</b><span id="bs">UIW Papua dan Papua Barat</span></div><h1>Rekap Durasi Create CTT</h1><p>Data APKT dicocokkan dengan Data AP2T per ID Pelanggan, diperbarui otomatis setiap 2 menit</p></header>
<div id="fl" aria-hidden="true"></div>
<main>
<div class="card"><div class="row">

</main>
<div id="md" hidden><div class="box"><div class="row" style="justify-content:space-between;align-items:center"><h2 id="mt"></h2><div class="row"><button class="alt" id="mx">Unduh Excel</button><button id="mc">Tutup</button></div></div><div class="wrap" id="mi"></div><div id="mf"></div></div></div>
<script>
const $=id=>document.getElementById(id),e=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const D={id:'1nis3nxgCj-U2IHLcs5UzYKTbZdKYGymlLhn81E-Llis',a:'Data APKT',b:'Data AP2T',ga:'1789637322',gb:'679644625',neg:0.1,tol:120,win:24,iv:2};
let R=[],tab='R',lim=200,open=new Set(),TR=[],KP=[],PP=null;
const MN=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const nz=s=>String(s).toLowerCase().replace(/[^a-z0-9]/g,''),p2=n=>String(n).padStart(2,'0'),n2=v=>v.toFixed(2).replace('.',',');
const hms=s=>{s=Math.round(s);return Math.floor(s/3600)+':'+p2(Math.floor(s%3600/60))+':'+p2(s%60)};
const fd=t=>{const d=new Date(t*1000);return p2(d.getUTCDate())+'/'+p2(d.getUTCMonth()+1)+'/'+d.getUTCFullYear()+' '+p2(d.getUTCHours())+'.'+p2(d.getUTCMinutes())+'.'+p2(d.getUTCSeconds())};
const BLN={jan:1,januari:1,january:1,feb:2,februari:2,february:2,mar:3,maret:3,march:3,apr:4,april:4,mei:5,may:5,jun:6,juni:6,june:6,jul:7,juli:7,july:7,agu:8,agt:8,agus:8,agustus:8,aug:8,august:8,sep:9,sept:9,september:9,okt:10,oktober:10,oct:10,october:10,nov:11,november:11,des:12,desember:12,dec:12,december:12};
function pd(s){s=String(s==null?'':s).trim();if(!s)return NaN;
 if(/^\d{5}(\.\d+)?$/.test(s)){const n=parseFloat(s);return Math.round((n-25569)*86400)}
 let m=s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})(.*)$/),y,mo,d,rest;
 if(m){y=+m[1];mo=+m[2];d=+m[3];rest=m[4]}
 else if(m=s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})(.*)$/)){d=+m[1];mo=+m[2];y=+m[3];if(y<100)y+=2000;rest=m[4]}
 else if(m=s.match(/^(\d{1,2})[\s-]+([A-Za-z]+)\.?[\s-]+(\d{2,4})(.*)$/)){d=+m[1];mo=BLN[m[2].toLowerCase()];y=+m[3];if(y<100)y+=2000;rest=m[4]}
 else return NaN;
 if(!mo||mo>12||d<1||d>31)return NaN;
 let h=0,mi=0,se=0;const t=String(rest||'').match(/(\d{1,2})[.:](\d{2})(?:[.:](\d{2}))?\s*([AaPp][Mm])?/);
 if(t){h=+t[1];mi=+t[2];se=+t[3]||0;if(t[4]){const pm=/p/i.test(t[4]);if(pm&&h<12)h+=12;if(!pm&&h==12)h=0}}
 return Date.UTC(y,mo-1,d,h,mi,se)/1000}
function csv(t){const r=[];let w=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];
 if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}
 else if(c=='"')q=true;else if(c==','){w.push(f);f=''}else if(c=='\n'){w.push(f);r.push(w);w=[];f=''}else if(c!='\r')f+=c}
 if(f!==''||w.length){w.push(f);r.push(w)}return r}
async function load(n,g){const u=g?`https://docs.google.com/spreadsheets/d/${D.id}/export?format=csv&gid=${encodeURIComponent(g)}&_=${Date.now()}`:`https://docs.google.com/spreadsheets/d/${D.id}/gviz/tq?tqx=out:csv&headers=1&sheet=${encodeURIComponent(n)}&_=${Date.now()}`;
 const r=await fetch(u,{cache:'no-store'}),t=r.ok?await r.text():'';
 if(!r.ok||/^\s*<(!doctype|html)/i.test(t))throw Error('Sheet "'+n+'" tidak bisa dibaca. Pastikan nama sheet benar dan akses spreadsheet "Siapa saja yang memiliki link: Pelihat".');return csv(t)}
function col(h,al,nm){const H=h.map(nz);let i=-1;for(const a of al){i=H.indexOf(a);if(i>=0)return i}
 for(const a of al){i=H.findIndex(x=>x.includes(a));if(i>=0)return i}
 throw Error('Kolom '+nm+' tidak ditemukan. Header yang terbaca: '+h.join(' | '))}
const ip=s=>{s=String(s==null?'':s).trim();if(/^\d+(\.\d+)?[eE][+-]?\d+$/.test(s)){const n=Number(s);if(isFinite(n))s=n.toFixed(0)}return s.replace(/\D/g,'')};
const CAN={},lb=s=>{s=String(s==null?'':s).replace(/\s+/g,' ').trim()||'-';const k=s.toUpperCase();return CAN[k]||(CAN[k]=s)};
function hdr(A,build){let er;for(let i=0;i<Math.min(A.length,15);i++){try{return{i,c:build(A[i])}}catch(x){er=er||x}}throw er}
function match(rep,trx){
 const tb={},rb={},W=D.win>0?D.win*3600:Infinity;
 trx.forEach(t=>{t.u=0;(tb[t.ip]=tb[t.ip]||[]).push(t)});rep.forEach(r=>{r.m=null;(rb[r.ip]=rb[r.ip]||[]).push(r)});
 for(const k in rb){const P=[];
  rb[k].forEach(r=>(tb[k]||[]).forEach(t=>{const d=t.t-r.t;if(d>=0&&d<=W)P.push([0,d,r,t]);else if(d<0&&d>=-D.tol)P.push([1,-d,r,t])}));
  P.sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
  P.forEach(([,,r,t])=>{if(!r.m&&!t.u){r.m=t;t.u=1}})}
 rep.forEach(r=>{if(!r.m){r.d=r.pt=r.sec=null;r.st='belum';return}
  r.d=r.m.t-r.t;r.st=r.d<0?'auto':'ok';r.pt=r.d<0?+D.neg:Math.round(r.d/60*100)/100;r.sec=r.d<0?D.neg*60:r.d})}
let busy=false;
async function sync(){if(busy)return;busy=true;$('err').textContent='';$('st').textContent='Menyinkronkan...';
 try{const[A,B]=await Promise.all([load(D.a,D.ga),load(D.b,D.gb)]);
  const ha=hdr(A,h=>({no:col(h,['nolaporan','nolapor','nomorlaporan'],'NO_LAPORAN (APKT)'),ar:col(h,['namaarea','area'],'NAMA_AREA (APKT)'),un:col(h,['namaunit','unit'],'NAMA_UNIT (APKT)'),tl:col(h,['tanggallapor','tgllapor','waktulapor'],'TANGGAL_LAPOR (APKT)'),ip:col(h,['idpel','idpelanggan'],'IDPEL (APKT)')}));
  const hb=hdr(B,h=>({ip:col(h,['idpel','idpelanggan'],'IDPEL (AP2T)'),tt:col(h,['tanggaltransaksi','tgltransaksi','tanggaltrx','tgltrx','waktutransaksi'],'Tanggal Transaksi (AP2T)')}));
  const c=ha.c,d=hb.c,seen=new Set(),rep=[],bad=[];let kosong=0,dupl=0,badB=0;
  A.slice(ha.i+1).forEach((x,n)=>{const no=String(x[c.no]||'').trim();if(!no){if(x.some(v=>String(v).trim()))kosong++;return}
   const t=pd(x[c.tl]);if(isNaN(t)){bad.push(no+' ("'+String(x[c.tl]||'').trim()+'")');return}
   if(seen.has(no)){dupl++;return}seen.add(no);
   rep.push({no,area:lb(x[c.ar]),unit:lb(x[c.un]),ip:ip(x[c.ip]),t})});
  const trx=[];B.slice(hb.i+1).forEach(x=>{const k=ip(x[d.ip]),t=pd(x[d.tt]);if(!k&&!String(x[d.tt]||'').trim())return;if(!k||isNaN(t)){badB++;return}trx.push({ip:k,t})});
  match(rep,trx);rep.sort((a,b)=>a.t-b.t);R=rep;fill();render();
  $('st').textContent='Tersinkron '+new Date().toLocaleTimeString('id-ID')+' ('+rep.length+' laporan, '+trx.length+' transaksi)';
  const w=[];if(bad.length)w.push('APKT: '+bad.length+' baris dilewati karena Tanggal Lapor tidak terbaca, contoh: '+bad.slice(0,3).join(', ')+(bad.every(b=>b.endsWith('("")'))?'. Tanggal terbaca kosong: cek sel di sheet; jika sel terisi, isi gid sheet di konfigurasi D (ga/gb) agar data dibaca mentah.':''));
  if(kosong)w.push('APKT: '+kosong+' baris dilewati karena NO_LAPORAN kosong');
  if(badB)w.push('AP2T: '+badB+' baris dilewati karena IDPEL/Tanggal Transaksi tidak terbaca');
  if(w.length)$('err').textContent='Perhatian:\n'+w.join('\n');
 }catch(x){$('err').textContent=x.message;$('st').textContent='Sinkron gagal'}finally{busy=false}}
const mk=r=>new Date(r.t*1000).toISOString().slice(0,7);
function opts(s,vals,all,lab){const cur=s.value,h='<option value="">'+all+'</option>'+vals.map(v=>`<option value="${e(v)}">${e(lab?lab(v):v)}</option>`).join('');if(s.dataset.h!==h){s.innerHTML=h;s.dataset.h=h}s.value=vals.includes(cur)?cur:''}
function fill(){opts($('fM'),[...new Set(R.map(mk))].sort().reverse(),'Semua bulan',v=>MN[+v.slice(5)-1]+' '+v.slice(0,4));
 opts($('fA'),[...new Set(R.map(r=>r.area))].sort(),'Semua area');fillU()}
function fillU(){const a=$('fA').value;opts($('fU'),[...new Set(R.filter(r=>!a||r.area==a).map(r=>r.unit))].sort(),'Semua unit')}
const filt=()=>{const m=$('fM').value,a=$('fA').value,u=$('fU').value;return R.filter(r=>(!m||mk(r)==m)&&(!a||r.area==a)&&(!u||r.unit==u))};
const agg=()=>({n:0,s:0,mn:1e12,mx:-1}),mg=(t,o)=>{t.n+=o.n;t.s+=o.s;t.mn=Math.min(t.mn,o.mn);t.mx=Math.max(t.mx,o.mx)};
function tree(rows){const A={};rows.filter(r=>r.m).forEach(r=>{const a=A[r.area]=A[r.area]||{name:r.area,t:agg(),U:{}},u=a.U[r.unit]=a.U[r.unit]||agg();
 [a.t,u].forEach(o=>mg(o,{n:1,s:r.pt,mn:r.sec,mx:r.sec}))});
 return Object.values(A).sort((x,y)=>x.name.localeCompare(y.name)).map(a=>({name:a.name,t:a.t,U:Object.entries(a.U).sort((x,y)=>x[0].localeCompare(y[0]))}))}
const cl=(a,u,o)=>[a,u,o.n,+(o.s/o.n).toFixed(2),hms(o.mn),hms(o.mx)];
function flat(rows){const t=tree(rows),out=[],fa=$('fA').value;TR=t.map(x=>x.name);
 t.forEach((x,i)=>{if(!fa){const r=cl(x.name,'Semua unit',x.t);r.i=i;out.push(r)}
  if(fa||open.has(x.name))x.U.forEach(([n,o])=>{const r=cl(x.name,n,o);r.u=1;out.push(r)})});
 if(out.length>1){const T=agg();t.forEach(x=>mg(T,x.t));const r=cl('TOTAL','',T);r.tot=1;out.push(r)}
 return out}
const RH=['Nama Area','Nama Unit','Jumlah No Laporan','Rata-rata (menit)','Durasi Tercepat (jj:mm:ss)','Durasi Terlama (jj:mm:ss)'];
const DH=['No','No Laporan','Nama Area','Nama Unit','ID Pelanggan','Tanggal Lapor','Tanggal Transaksi','Durasi (jj:mm:ss)','Poin (menit)','Status'];
const SL={ok:'Create CTT',auto:'Transaksi lebih awal',belum:'Belum create'};
const detRow=(r,i)=>[i+1,r.no,r.area,r.unit,r.ip,fd(r.t),r.m?fd(r.m.t):'',r.m?hms(r.sec):'',r.pt==null?'':r.pt,SL[r.st]];
const det=l=>({h:DH,a:l.map(detRow),f:[8]});
function recHtml(rows){const L=flat(rows),fa=$('fA').value;
 const ctl=fa?'':'<div class="row" style="margin-bottom:8px"><button class="alt" id="bEa">Buka semua UP3</button><button class="alt" id="bEc">Tutup semua</button></div>';
 return ctl+'<table><thead><tr>'+RH.map((x,i)=>`<th class="${i>1?'n':''}">${x}</th>`).join('')+'</tr></thead><tbody>'+
  L.map(c=>{const h=c.i!==undefined,nm=h?(open.has(TR[c.i])?'▾ ':'▸ ')+e(c[0]):e(c[0]);
   return `<tr class="${c.tot?'tot':c.u?'u':'sub'}"${h?` data-i="${c.i}"`:''}><td>${nm}</td><td>${e(c[1])}</td><td class="n">${c[2]}</td><td class="n">${n2(c[3])}</td><td class="n">${c[4]}</td><td class="n">${c[5]}</td></tr>`}).join('')+'</tbody></table>'}
function render(){const rows=filt(),ok=rows.filter(r=>r.m),by=f=>[...ok].sort((a,b)=>f*(a.sec-b.sec)),av=ok.length?ok.reduce((s,r)=>s+r.pt,0)/ok.length:0;
 KP=[{l:'Total No Laporan',v:rows.length,d:()=>det(rows)},{l:'Sudah create CTT',v:ok.length,d:()=>det(ok)},{l:'Belum create',v:rows.length-ok.length,d:()=>det(rows.filter(r=>!r.m))},
  {l:'Rata-rata (menit)',v:ok.length?n2(av):'-',d:()=>({h:RH,a:flat(rows),f:[3]})},{l:'Tercepat',v:ok.length?hms(by(1)[0].sec):'-',d:()=>det(ok.filter(r=>r.sec==by(1)[0].sec))},{l:'Terlama',v:ok.length?hms(by(-1)[0].sec):'-',d:()=>det(ok.filter(r=>r.sec==by(-1)[0].sec))}];
 $('kpi').innerHTML=KP.map((k,i)=>`<button data-k="${i}"><b>${k.v}</b>${k.l}</button>`).join('');$('more').innerHTML='';chart(rows);
 if(!rows.length){$('out').innerHTML='<div class="emp">Belum ada data. Klik "Sinkron sekarang" atau ubah filter.</div>';return}
 if(tab=='R'){$('out').innerHTML=recHtml(rows);return}
 const s=rows.slice(0,lim);$('out').innerHTML='<table><thead><tr>'+DH.map((h,i)=>`<th class="${i==8?'n':''}">${h}</th>`).join('')+'</tr></thead><tbody>'+
  s.map((r,i)=>{const c=detRow(r,i);return `<tr>${c.slice(0,9).map((v,j)=>`<td class="${j==8?'n':''}">${e(j==8&&v!==''?n2(v):v)}</td>`).join('')}<td><span class="tag ${r.st}">${c[9]}</span></td></tr>`}).join('')+'</tbody></table>';
 if(rows.length>lim){$('more').innerHTML=`<button class="alt" id="bM">Tampilkan ${Math.min(200,rows.length-lim)} baris lagi (${lim} dari ${rows.length})</button>`;$('bM').onclick=()=>{lim+=200;render()}}}
let CH={mode:'g',met:'n',sel:null},CI=[],CF=null;
const dk=t=>new Date(t*1000).toISOString().slice(0,10);
function chData(rows){const fa=$('fA').value,fm=$('fM').value,G={};
 rows.forEach(r=>{const k=CH.mode=='g'?(fa?r.unit:r.area):(fm?dk(r.t):mk(r)),g=G[k]=G[k]||{k,n:0,ok:0,s:0};g.n++;if(r.m){g.ok++;g.s+=r.pt}});
 let a=Object.values(G).map(g=>{g.avg=g.ok?g.s/g.ok:0;g.l=CH.mode=='g'?g.k:(fm?g.k.slice(8):MN[+g.k.slice(5,7)-1].slice(0,3)+' '+g.k.slice(2,4));return g});
 if(CH.mode=='g')a.sort((x,y)=>CH.met=='n'?y.n-x.n:y.avg-x.avg||y.n-x.n);else a.sort((x,y)=>x.k<y.k?-1:1);return a}
const chv=g=>CH.met=='n'?g.n:g.avg,chs=g=>g.l+': '+g.n+' laporan, '+g.ok+' create CTT, '+(g.n-g.ok)+' belum'+(g.ok?', rata-rata '+n2(g.avg)+' menit':'');
function chart(rows){CF=rows;const fa=$('fA').value,fm=$('fM').value;
 $('chG').textContent=fa?'Per Unit':'Per Area';$('chT').textContent=fm?'Tren harian':'Tren bulanan';
 [['chG',CH.mode=='g'],['chT',CH.mode=='t'],['chN',CH.met=='n'],['chA',CH.met=='a']].forEach(([i,o])=>$(i).classList.toggle('on',o));
 $('chL').innerHTML=CH.met=='n'?'<span><i class="ok"></i>Sudah create CTT</span><span><i class="bl"></i>Belum create</span>':'<span><i class="av"></i>Rata-rata durasi create CTT (menit)</span>';
 CI=chData(rows);if(!CI.some(g=>g.k==CH.sel))CH.sel=null;
 if(!CI.length){$('chB').innerHTML='<div class="emp">Belum ada data untuk grafik.</div>';chd();return}
 const mx=Math.max(...CI.map(chv),1e-9);
 $('chB').innerHTML=CH.mode=='g'?CI.map((g,i)=>{const bar=CH.met=='n'?`<i class="s ok" style="width:${g.ok/mx*100}%"></i><i class="s bl" style="width:${(g.n-g.ok)/mx*100}%"></i>`:`<i class="s av" style="width:${g.avg/mx*100}%"></i>`;
   return `<button class="cb${CH.sel==g.k?' on':''}" data-c="${i}" title="${e(chs(g)).replace(/"/g,'&quot;')}"><span class="cl">${e(g.l)}</span><span class="ct">${bar}</span><span class="cv">${CH.met=='n'?g.n:n2(g.avg)}</span></button>`}).join(''):
  '<div class="vc">'+CI.map((g,i)=>{const bar=CH.met=='n'?`<i class="s ok" style="height:${g.ok/mx*100}%"></i><i class="s bl" style="height:${(g.n-g.ok)/mx*100}%"></i>`:`<i class="s av" style="height:${g.avg/mx*100}%"></i>`;
   return `<button class="vb${CH.sel==g.k?' on':''}" data-c="${i}" title="${e(chs(g)).replace(/"/g,'&quot;')}"><span class="vt">${bar}</span><span class="vl">${e(g.l)}</span></button>`}).join('')+'</div>';
 chd()}
function chd(){const g=CI.find(x=>x.k==CH.sel),b=$('chD');if(!g){b.hidden=true;return}
 const can=CH.mode=='g'||!$('fM').value;
 b.innerHTML=`<span><b>${e(g.l)}</b> — ${g.n} laporan · ${g.ok} sudah create CTT · ${g.n-g.ok} belum · rata-rata ${g.ok?n2(g.avg)+' menit':'-'}</span>`+(can?'<button id="chF">Filter ke ini</button>':'');b.hidden=false}
function chf(g){if(CH.mode=='g'){if($('fA').value)$('fU').value=g.k;else{$('fA').value=g.k;fillU()}}else $('fM').value=g.k;CH.sel=null;lim=200;render()}
$('chG').onclick=()=>{CH.mode='g';CH.sel=null;chart(CF||filt())};$('chT').onclick=()=>{CH.mode='t';CH.sel=null;chart(CF||filt())};
$('chN').onclick=()=>{CH.met='n';chart(CF||filt())};$('chA').onclick=()=>{CH.met='a';chart(CF||filt())};
$('chC').onclick=ev=>{const f=ev.target.closest('#chF');if(f){const g=CI.find(x=>x.k==CH.sel);if(g)chf(g);return}
 const b=ev.target.closest('[data-c]');if(!b)return;const g=CI[+b.dataset.c];CH.sel=CH.sel==g.k?null:g.k;chart(CF||filt())};
function dl(h,a,n){const ws=XLSX.utils.aoa_to_sheet([h,...a]);ws['!cols']=h.map((x,i)=>({wch:Math.min(34,Math.max(12,x.length,...a.slice(0,60).map(r=>String(r[i]).length)))}));
 const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Rekap');XLSX.writeFile(wb,n+'.xlsx')}
const sfx=()=>{const f=[$('fM').value,$('fA').value,$('fU').value].filter(Boolean).join('_').replace(/[^\w-]+/g,'-');return f?'_'+f:''};
function xl(k){const rows=filt();if(!rows.length)return alert('Tidak ada data untuk diunduh.');
 k=='R'?dl(RH,flat(rows),'CTT_Rekap'+sfx()):dl(DH,rows.map(detRow),'CTT_Detail'+sfx())}
function pop(k){const x=KP[k],d=x.d();PP={...d,n:'CTT_'+x.l.replace(/[^\w]+/g,'-')+sfx()};
 $('mt').textContent=x.l+' ('+d.a.length+' baris)';
 $('mi').innerHTML='<table><thead><tr>'+d.h.map((h,i)=>`<th class="${d.f.includes(i)?'n':''}">${h}</th>`).join('')+'</tr></thead><tbody>'+
  (d.a.length?d.a.slice(0,300).map(r=>'<tr>'+r.map((v,j)=>`<td class="${d.f.includes(j)?'n':''}">${e(d.f.includes(j)&&v!==''?n2(v):v)}</td>`).join('')+'</tr>').join(''):'<tr><td colspan="'+d.h.length+'" class="emp">Tidak ada data</td></tr>')+'</tbody></table>';
 $('mf').textContent=d.a.length>300?'Menampilkan 300 baris pertama. File Excel berisi semua '+d.a.length+' baris.':'';$('md').hidden=false}
function setTab(t){tab=t;lim=200;$('tR').classList.toggle('on',t=='R');$('tD').classList.toggle('on',t=='D');render()}
$('fM').onchange=$('fU').onchange=()=>{lim=200;render()};$('fA').onchange=()=>{fillU();lim=200;render()};
$('tR').onclick=()=>setTab('R');$('tD').onclick=()=>setTab('D');$('xR').onclick=()=>xl('R');$('xD').onclick=()=>xl('D');$('bS').onclick=sync;
$('out').onclick=ev=>{const b=ev.target.closest('button');
 if(b&&b.id=='bEa'){TR.forEach(n=>open.add(n));return render()}if(b&&b.id=='bEc'){open.clear();return render()}
 const t=ev.target.closest('tr[data-i]');if(!t)return;const n=TR[+t.dataset.i];open.has(n)?open.delete(n):open.add(n);render()};
$('kpi').onclick=ev=>{const b=ev.target.closest('button[data-k]');if(b)pop(+b.dataset.k)};
$('mc').onclick=()=>{$('md').hidden=true};$('md').onclick=ev=>{if(ev.target.id=='md')$('md').hidden=true};
document.onkeydown=ev=>{if(ev.key=='Escape')$('md').hidden=true};$('mx').onclick=()=>dl(PP.h,PP.a,PP.n);
function fitBrand(){const t=$('bt'),s=$('bs');s.style.fontSize='10px';s.style.fontSize=(10*t.offsetWidth/s.offsetWidth)+'px'}
function lab(el){el.querySelectorAll('table').forEach(t=>{const h=[...t.querySelectorAll('th')].map(x=>x.textContent);t.querySelectorAll('tbody tr').forEach(r=>[...r.children].forEach((c,i)=>{c.dataset.l=h[i]||''}))})}
['out','mi'].forEach(i=>new MutationObserver(()=>lab($(i))).observe($(i),{childList:true}));
fitBrand();if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fitBrand);
sync();setInterval(sync,D.iv*60000);
</script>
<script>
(function(){
const v=document.getElementById('hv'),hr=document.getElementById('hr');
if(v){v.muted=true;v.defaultMuted=true;
 const go=()=>{const r=v.play();if(r&&r.catch)r.catch(()=>{})};
 go();v.addEventListener('canplay',go);v.addEventListener('ended',()=>{v.currentTime=0;go()});
 v.addEventListener('pause',()=>{if(!document.hidden)go()});
 document.addEventListener('visibilitychange',()=>{if(!document.hidden)go()});
 ['touchstart','pointerdown','click','scroll','keydown'].forEach(ev=>addEventListener(ev,go,{once:true,passive:true}));
 v.addEventListener('error',()=>{if(hr)hr.hidden=true})}
const L=document.getElementById('fl');if(!L)return;
const rd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)];
const still=window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches;
const COL=['#9c3f22','#d49a2a','#5f6535','#7a6247'];
function build(){
 L.textContent='';
 const m=innerWidth<=640,n=m?11:20;
 for(let i=0;i<n;i++){
  const sp=document.createElement('span'),b=document.createElement('b'),sz=m?rd(26,64):rd(34,96);
  b.textContent=pick(['1','2','3']);
  sp.style.cssText='left:'+rd(-2,96).toFixed(1)+'%;font-size:'+sz.toFixed(0)+'px;color:'+pick(COL)+
   ';--o:'+rd(.28,.45).toFixed(2)+';--d:'+rd(16,34).toFixed(1)+'s;--dl:-'+rd(0,34).toFixed(1)+'s;--s:'+rd(3,6.5).toFixed(1)+
   's;--x:'+rd(-140,140).toFixed(0)+'px;--r:'+rd(-80,80).toFixed(0)+'deg';
  if(still)sp.style.cssText+=';top:'+rd(4,92).toFixed(0)+'%;opacity:.3';
  sp.appendChild(b);L.appendChild(sp)}
}
build();
let w=innerWidth;addEventListener('resize',()=>{const m1=w<=640,m2=innerWidth<=640;w=innerWidth;if(m1!==m2)build()});
})();
</script>
