<!DOCTYPE html>
<html lang="id">
<head>
<base target="_top">
<meta charset="utf-8">
<title>Rekapitulasi Pekerjaan</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  *{box-sizing:border-box}
  body{font-family:Arial,Helvetica,sans-serif;margin:0;background:#f3f6fa;color:#1f2d3d}
  header{background:#0b6b8a;color:#fff;padding:14px 20px}
  header h1{margin:0;font-size:18px}
  header small{opacity:.85}
  main{padding:16px 20px;max-width:1200px;margin:auto}
  .card{background:#fff;border-radius:8px;padding:14px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
  .filter{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
  label{font-size:12px;display:block;margin-bottom:3px;color:#556}
  input,select{padding:7px 8px;border:1px solid #c5ccd6;border-radius:5px;font-size:14px}
  button{padding:8px 14px;border:0;border-radius:5px;background:#0b6b8a;color:#fff;cursor:pointer;font-size:14px}
  button.sec{background:#5b6b7b}
  button.ok{background:#1f8a4c}
  button:disabled{opacity:.5;cursor:not-allowed}
  .sum{display:flex;gap:10px;flex-wrap:wrap}
  .sum div{background:#eaf3f7;padding:8px 14px;border-radius:6px;font-size:13px}
  .sum b{font-size:18px;display:block}
  .wrap{overflow-x:auto}
  table{border-collapse:collapse;width:100%;font-size:13px}
  th,td{border-bottom:1px solid #e3e8ee;padding:7px 8px;text-align:left;vertical-align:top}
  th{background:#eef2f6;position:sticky;top:0}
  .tag{padding:2px 7px;border-radius:10px;font-size:11px;color:#fff}
  .SCADA{background:#0b6b8a}.Telekomunikasi{background:#8a4b0b}
  .Preventif{background:#1f8a4c}.Korektif{background:#c0392b}
  #status{font-size:13px;margin:6px 0;color:#444}
  .bar{height:8px;background:#dde;border-radius:4px;overflow:hidden;display:none}
  .bar i{display:block;height:100%;width:0;background:#1f8a4c}
</style>
</head>
<body>
<header>
  <h1>Rekapitulasi Pekerjaan SCADA &amp; Telekomunikasi</h1>
  <small id="info"></small>
</header>
<main>
  <div class="card">
    <div class="filter">
      <div><label>Dari tanggal</label><input type="date" id="dari"></div>
      <div><label>Sampai tanggal</label><input type="date" id="sampai"></div>
      <div><label>Kategori</label>
        <select id="kat"><option value="">Semua</option><option>SCADA</option><option>Telekomunikasi</option></select></div>
      <div><label>Jenis</label>
        <select id="jenis"><option value="">Semua</option><option>Preventif</option><option>Korektif</option></select></div>
      <div><label>Cari asset / uraian</label><input id="kata" placeholder="mis. GH Tomohon"></div>
      <button onclick="cari()">Tampilkan</button>
    </div>
  </div>

  <div class="card">
    <div class="sum" id="sum"></div>
    <p id="status"></p>
    <div class="bar" id="bar"><i id="barI"></i></div>
    <div style="margin:8px 0;display:flex;gap:8px;flex-wrap:wrap">
      <button class="ok" id="btnZip" onclick="zipSemua()" disabled>Download Semua Foto (ZIP)</button>
      <button class="sec" id="btnCsv" onclick="exportCsv()" disabled>Export Rekap (CSV/Excel)</button>
    </div>
    <div class="wrap">
      <table>
        <thead><tr><th>No</th><th>Tanggal</th><th>Kategori</th><th>Jenis</th><th>Tipe</th><th>Asset / Remote Station</th><th>Uraian</th><th>Pelaksana</th><th>Foto</th></tr></thead>
        <tbody id="tb"><tr><td colspan="9">Pilih tanggal lalu klik Tampilkan.</td></tr></tbody>
      </table>
    </div>
  </div>
</main>

<script>
// ====== PENGATURAN ======
const API_URL = 'https://script.google.com/macros/s/AKfycbwOTR_EA3KOa8PYo1JK4klHyAdGAEiHqdTOzTBsd883IpUAb5lPlKcaGCkJ80PsLAg/exec';
const TOKEN = '';   // isi jika CFG.API_TOKEN di Code.gs diisi

// Dipakai otomatis: di dalam Apps Script -> google.script.run, di luar (file lokal/hosting) -> fetch ke API_URL
function api(action, p){
  if (typeof google !== 'undefined' && google.script && google.script.run){
    return new Promise((ok, err) => {
      const r = google.script.run.withSuccessHandler(ok).withFailureHandler(e => err(new Error(e.message || e)));
      if (action === 'pekerjaan') r.getPekerjaan(p.dari, p.sampai, p.kategori, p.jenis, p.kata);
      else r.getFotoBase64(p.id);
    });
  }
  const q = new URLSearchParams(Object.assign({action: action, token: TOKEN}, p));
  return fetch(API_URL + '?' + q.toString())
    .then(r => r.json())
    .then(j => { if (j && j.error) throw new Error(j.error); return j; });
}

let DATA = [];
const $ = id => document.getElementById(id);

(function init(){
  const t = new Date(), s = new Date(t.getFullYear(), t.getMonth(), 1);
  $('dari').value = iso(s); $('sampai').value = iso(t);
  cari();
})();
function iso(d){ const z=n=>('0'+n).slice(-2); return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate()); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function aman(s){ return String(s).replace(/[\\\/:*?"<>|]+/g,'-').replace(/\s+/g,'_').replace(/_+/g,'_'); }

function cari(){
  $('status').textContent = 'Memuat data...';
  $('btnZip').disabled = $('btnCsv').disabled = true;
  api('pekerjaan', {dari: $('dari').value, sampai: $('sampai').value, kategori: $('kat').value, jenis: $('jenis').value, kata: $('kata').value})
    .then(r => { DATA = r.rows || []; $('info').textContent = r.info || ''; render(); })
    .catch(e => {
      $('status').innerHTML = '<b style="color:#c0392b">Gagal memuat data: ' + esc(e.message) +
        '</b><br>Pastikan Web App di-deploy dengan akses "Anyone" dan versi terbaru.';
    });
}

function render(){
  const tb = $('tb');
  if (!DATA.length){ tb.innerHTML = '<tr><td colspan="9">Tidak ada pekerjaan pada filter ini.</td></tr>'; }
  else tb.innerHTML = DATA.map((r,i)=>`<tr>
    <td>${i+1}</td><td>${r.tanggal}</td>
    <td><span class="tag ${esc(r.kategori)}">${esc(r.kategori)}</span></td>
    <td><span class="tag ${esc(r.jenis)}">${esc(r.jenis)}</span></td>
    <td>${esc(r.tipe)}</td><td><b>${esc(r.asset)}</b></td><td>${esc(r.uraian)}</td><td>${esc(r.pelaksana)}</td>
    <td>${r.foto.length ? `<button onclick="unduhSatu(${i})">Download (${r.foto.length})</button>` : '<i>-</i>'}</td></tr>`).join('');
  const n = k => DATA.filter(r=>r.kategori===k).length;
  const nf = DATA.reduce((a,r)=>a+r.foto.length,0);
  $('sum').innerHTML = `<div><b>${DATA.length}</b>Total pekerjaan</div><div><b>${n('SCADA')}</b>SCADA</div><div><b>${n('Telekomunikasi')}</b>Telekomunikasi</div>
    <div><b>${DATA.filter(r=>r.jenis==='Preventif').length}</b>Preventif</div><div><b>${DATA.filter(r=>r.jenis==='Korektif').length}</b>Korektif</div><div><b>${nf}</b>Foto</div>`;
  $('status').textContent = '';
  $('btnCsv').disabled = !DATA.length; $('btnZip').disabled = !nf;
}

function ambilFoto(id){ return api('foto', {id: id}); }
function namaFoto(r, n, ext){
  return `${r.tanggal}_${aman(r.asset)}_${n}.${ext}`;
}
function simpan(blob, nama){
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nama;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
}
function b64ke(b64, mime){
  const bin = atob(b64), u = new Uint8Array(bin.length);
  for (let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i);
  return new Blob([u], {type:mime});
}
function progres(p, teks){ $('bar').style.display = p>=1||p<0 ? 'none':'block'; $('barI').style.width = (p*100)+'%'; $('status').textContent = teks||''; }

async function unduhSatu(i){
  const r = DATA[i];
  try{
    if (r.foto.length === 1){
      const f = await ambilFoto(r.foto[0].id);
      simpan(b64ke(f.b64,f.mime), namaFoto(r,1,f.ext)); return;
    }
    const zip = new JSZip();
    for (let k=0;k<r.foto.length;k++){
      progres(k/r.foto.length, `Mengambil foto ${k+1}/${r.foto.length}...`);
      const f = await ambilFoto(r.foto[k].id);
      zip.file(namaFoto(r,k+1,f.ext), f.b64, {base64:true});
    }
    simpan(await zip.generateAsync({type:'blob'}), `${r.tanggal}_${aman(r.asset)}.zip`);
    progres(1,'Selesai.');
  }catch(e){ progres(1,'Gagal: '+e.message); }
}

async function zipSemua(){
  const total = DATA.reduce((a,r)=>a+r.foto.length,0);
  if (total > 150 && !confirm(total+' foto. Proses bisa lama. Lanjutkan?')) return;
  $('btnZip').disabled = true;
  const zip = new JSZip(); let done = 0;
  try{
    for (const r of DATA){
      const folder = zip.folder(`${r.kategori}/${r.tanggal}_${aman(r.asset)}`);
      for (let k=0;k<r.foto.length;k++){
        progres(done/total, `Mengambil foto ${done+1}/${total}...`);
        const f = await ambilFoto(r.foto[k].id);
        folder.file(namaFoto(r,k+1,f.ext), f.b64, {base64:true});
        done++;
      }
    }
    progres(0.99,'Membuat ZIP...');
    simpan(await zip.generateAsync({type:'blob'}), `Eviden_${$('dari').value}_sd_${$('sampai').value}.zip`);
    progres(1,'Selesai: '+done+' foto.');
  }catch(e){ progres(1,'Gagal: '+e.message); }
  $('btnZip').disabled = false;
}

function exportCsv(){
  const h = ['No','Tanggal','Kategori','Jenis','Tipe','Asset / Remote Station','Uraian','Pelaksana','Jumlah Foto'];
  const q = s => '"'+String(s==null?'':s).replace(/"/g,'""')+'"';
  const baris = [h.map(q).join(';')].concat(DATA.map((r,i)=>[i+1,r.tanggal,r.kategori,r.jenis,r.tipe,r.asset,r.uraian,r.pelaksana,r.foto.length].map(q).join(';')));
  simpan(new Blob(['\ufeff'+baris.join('\r\n')],{type:'text/csv;charset=utf-8'}), `Rekap_${$('dari').value}_sd_${$('sampai').value}.csv`);
}
</script>
</body>
</html>
