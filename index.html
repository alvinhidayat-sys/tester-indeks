<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Monitoring Pemberkasan</title>
<style>
:root{--bg:#eceff3;--card:#fff;--ink:#14202e;--mut:#66758a;--line:#dde3ea;--navy:#0f2a43;--act:#d98a0b;--ok:#2a8a57;--idle:#a7b2c0;--teal:#0a7c86}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 "Segoe UI",system-ui,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--navy);color:#fff;padding:18px 16px 64px}
.wrap{max-width:1180px;margin:0 auto}
.hd{display:flex;justify-content:space-between;align-items:center;gap:12px}
h1{margin:0;font-size:20px;font-weight:700;letter-spacing:.2px}
header p{margin:2px 0 0;color:#a9bdd1;font-size:13px}
button{font:inherit;cursor:pointer}
.btn{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:8px;padding:8px 14px}
.btn:hover{background:rgba(255,255,255,.2)}
.filters{margin:-44px auto 14px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;background:var(--card);border-radius:12px;padding:14px;box-shadow:0 6px 20px rgba(15,42,67,.12)}
.filters label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mut);font-weight:600}
select,input[type=month],input[type=date]{font:inherit;color:var(--ink);padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;width:100%}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--card);border-radius:10px;padding:10px 14px;border-left:4px solid var(--idle)}
.stat b{display:block;font-size:24px;line-height:1.1}
.stat span{font-size:12px;color:var(--mut)}
.stat.p{border-color:var(--act)}.stat.d{border-color:var(--ok)}.stat.t{border-color:var(--navy)}
.banner{background:#fff4dc;border:1px solid #f0d28a;color:#6a4a00;padding:10px 14px;border-radius:10px;margin-bottom:12px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px;padding-bottom:40px}
.card{background:var(--card);border-radius:12px;padding:14px 16px;cursor:pointer;border:1px solid var(--line);transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--teal);transform:translateY(-2px)}
.card:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.tag{font-size:12px;font-weight:600;color:var(--teal)}
.st{font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;background:#e8ecf1;color:var(--mut)}
.st.proc{background:#fdf0d4;color:#8a5a00}.st.done{background:#dcf2e5;color:#1d6b42}
h3{margin:0 0 10px;font-size:16px}
.track{display:flex;align-items:center;margin-bottom:10px}
.track i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-style:normal;font-weight:700;background:#e8ecf1;color:var(--mut);flex:none}
.track u{height:3px;flex:1;background:#e8ecf1;min-width:14px}
.track .done{background:var(--ok);color:#fff}.track .act{background:var(--act);color:#fff}
.track u.done{background:var(--ok)}
.pos{min-height:40px;font-size:13px}
.pos div{margin-bottom:2px}.pos small{color:var(--mut)}
.bar{height:5px;background:#e8ecf1;border-radius:9px;margin:10px 0 4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
.meta{font-size:12px;color:var(--mut)}
.empty{grid-column:1/-1;text-align:center;color:var(--mut);padding:50px 10px}
.ov{position:fixed;inset:0;background:rgba(10,24,38,.55);display:none;align-items:center;justify-content:center;padding:14px;z-index:9}
.ov.on{display:flex}
.modal{background:#fff;border-radius:14px;width:100%;max-width:680px;max-height:92vh;display:flex;flex-direction:column;overflow:hidden}
.mh{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}
.mh h2{margin:0;font-size:18px}.mh p{margin:2px 0 0;color:var(--mut);font-size:13px}
.x{background:none;border:0;font-size:26px;line-height:1;color:var(--mut)}
.mb{padding:14px 18px 18px;overflow:auto}
.stg{border-left:3px solid var(--idle);padding:2px 0 2px 14px;margin-bottom:16px}
.stg.act{border-color:var(--act)}.stg.done{border-color:var(--ok)}
.stg h4{margin:0 0 8px;font-size:14px}
.stg.lock h4{color:var(--mut)}
.u{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:8px 12px;padding:9px 0;border-top:1px dashed var(--line);align-items:start}
.un{font-weight:600}
.f{display:flex;flex-direction:column;gap:5px}
.ck{display:flex;align-items:center;gap:7px;font-size:13px}
.ck input{width:18px;height:18px;accent-color:var(--teal)}
.f input[type=date]{padding:6px 8px;font-size:13px}
.f input:disabled{opacity:.45}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:9px 16px;border-radius:9px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.toast.on{opacity:1}
@media(max-width:700px){.filters{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.u{grid-template-columns:1fr 1fr}.un{grid-column:1/-1}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><div class="wrap hd">
  <div><h1>Monitoring Pemberkasan</h1><p>Posisi terakhir berkas tagihan di setiap tahap verifikasi</p></div>
  <button class="btn" id="btnRef">Muat ulang</button>
</div></header>

<main class="wrap">
  <div class="filters">
    <label>Bidang<select id="fBidang"></select></label>
    <label>Project<select id="fProject"></select></label>
    <label>Periode tagihan<input type="month" id="fPeriode"></label>
  </div>
  <div id="banner"></div>
  <div class="stats" id="stats"></div>
  <div class="grid" id="grid"></div>
</main>

<div class="ov" id="ov"><div class="modal" role="dialog" aria-modal="true">
  <div class="mh"><div><h2 id="mT"></h2><p id="mS"></p></div><button class="x" id="mX" aria-label="Tutup">&times;</button></div>
  <div class="mb" id="mB"></div>
</div></div>
<div class="toast" id="toast"></div>

<script>
/* ===== PENGATURAN ===== */
const SHEET_ID = '1NnW0HlZVAovqO3tOvhVPNl-bGrY3UrKuYT1iuTraT5U';
const MASTER_GID = '0';            // tab alur verifikasi (data_verifikasi)
const DATA_SHEET = 'data_berkas';  // tab baru untuk ceklis berkas
const API_URL = 'https://script.google.com/macros/s/AKfycbyjOyAqz2WAIIpGqzmm2zINxbtMLR99CuSxvzm2wsXO57DCnw0-SSul6H_rTPjbWkqv/exec'; // URL Web App Apps Script
/* ====================== */

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const fmt = d => d ? new Date(d + 'T00:00:00').toLocaleDateString('id-ID', {day:'numeric', month:'short', year:'numeric'}) : '';
const BCOL = {Distribusi:'#0a7c86', Transmisi:'#5b4bb7', Pembangkit:'#b5651d'};

let projects = [], data = {}, cur = -1, shown = [];
const S = {bidang:'', project:'', periode: today().slice(0, 7)};

/* ---- baca data dari Google Sheets (gviz) ---- */
async function gv(param) {
  const r = await fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&headers=1&${param}&_=${Date.now()}`);
  const t = await r.text();
  const j = JSON.parse(t.substring(t.indexOf('{'), t.lastIndexOf('}') + 1));
  if (j.status === 'error') throw new Error('gviz');
  const labels = j.table.cols.map(c => (c.label || '').trim().toLowerCase());
  return j.table.rows.map(r => { const o = {}; labels.forEach((l, i) => { if (l) o[l] = r.c[i] ? r.c[i].v : null; }); return o; });
}
function nd(v) { // normalisasi tanggal -> yyyy-mm-dd
  if (v == null || v === '') return '';
  v = String(v);
  const m = v.match(/^Date\((\d+),(\d+),(\d+)/);
  if (m) return m[1] + '-' + String(+m[2] + 1).padStart(2, '0') + '-' + m[3].padStart(2, '0');
  return /^\d{4}-\d{2}/.test(v) ? v.slice(0, 10) : '';
}
const isT = v => v === true || String(v).toUpperCase() === 'TRUE';
const key = (p, per, s, u) => [p, per, s, u].join('|');
const rec = (p, per, s, u) => data[key(p, per, s, u)] || {masuk:false, tm:'', selesai:false, ts:''};

async function load() {
  $('banner').innerHTML = '';
  try {
    const rows = (await gv('gid=' + MASTER_GID)).filter(r => r.bidang && r.nama_project && r.nama_unit);
    const map = {};
    rows.forEach(r => {
      const p = map[r.nama_project] ||= {name:r.nama_project, bidang:r.bidang, stages:{}};
      const n = Number(r.urutan) || 1;
      const s = p.stages[n] ||= {urutan:n, ket:String(r.keterangan || '').replace(/^./, c => c.toUpperCase()), units:[]};
      s.units.push(r.nama_unit);
    });
    projects = Object.values(map).map(p => ({...p, stages:Object.values(p.stages).sort((a, b) => a.urutan - b.urutan)}));
  } catch (e) {
    $('banner').innerHTML = '<div class="banner">Alur verifikasi tidak bisa dibaca. Pastikan Google Sheets dibagikan dengan akses "Siapa saja yang memiliki link: Pelihat".</div>';
    return;
  }
  data = {};
  try {
    (await gv('sheet=' + encodeURIComponent(DATA_SHEET))).forEach(r => {
      if (!r.nama_project) return;
      const per = nd(r.periode).slice(0, 7);
      data[key(r.nama_project, per, Number(r.urutan), r.nama_unit)] = {masuk:isT(r.masuk), tm:nd(r.tgl_masuk), selesai:isT(r.selesai), ts:nd(r.tgl_selesai)};
    });
  } catch (e) {
    $('banner').innerHTML = '<div class="banner">Sheet "' + DATA_SHEET + '" belum ditemukan. Jalankan fungsi setupSheet() di Apps Script untuk membuatnya.</div>';
  }
  if (!API_URL) $('banner').innerHTML += '<div class="banner">Mode lihat saja: isi API_URL dengan URL Web App Apps Script agar ceklis bisa disimpan.</div>';
  fillFilters(); render();
  if (cur >= 0 && $('ov').classList.contains('on')) renderModal();
}

/* ---- logika posisi berkas ---- */
function analyze(P, per) {
  let done = 0, total = 0, last = '';
  const st = P.stages.map(s => {
    const us = s.units.map(u => { const r = rec(P.name, per, s.urutan, u); total++; if (r.selesai) done++; [r.tm, r.ts].forEach(d => { if (d > last) last = d; }); return {u, r}; });
    return {...s, us, all:us.every(x => x.r.selesai), any:us.some(x => x.r.masuk)};
  });
  st.forEach((s, i) => { s.open = i === 0 || st[i - 1].all; s.state = s.all ? 'done' : (s.any ? 'act' : 'idle'); });
  const c = st.find(s => !s.all);
  let status = 'new', pos = [];
  if (!c) {
    status = 'done';
    pos = [{t:'Selesai: ' + st[st.length - 1].us.map(x => x.u).join(', '), d:last, ok:1}];
  } else {
    const hold = c.us.filter(x => x.r.masuk && !x.r.selesai);
    if (hold.length) { status = 'proc'; pos = hold.map(x => ({t:x.u, d:x.r.tm, hold:1})); }
    else if (st.some(s => s.any)) { status = 'proc'; pos = [{t:'Menunggu masuk ke ' + c.us.filter(x => !x.r.masuk).map(x => x.u).join(', '), d:last, wait:1}]; }
  }
  return {st, status, pos, done, total};
}

/* ---- tampilan ---- */
function fillFilters() {
  const bs = [...new Set(projects.map(p => p.bidang))];
  if (S.bidang && !bs.includes(S.bidang)) S.bidang = '';
  $('fBidang').innerHTML = '<option value="">Semua bidang</option>' + bs.map(b => `<option ${b === S.bidang ? 'selected' : ''}>${esc(b)}</option>`).join('');
  const ps = projects.filter(p => !S.bidang || p.bidang === S.bidang);
  if (S.project && !ps.some(p => p.name === S.project)) S.project = '';
  $('fProject').innerHTML = '<option value="">Semua project</option>' + ps.map(p => `<option ${p.name === S.project ? 'selected' : ''}>${esc(p.name)}</option>`).join('');
  $('fPeriode').value = S.periode;
}

function render() {
  shown = projects.filter(p => (!S.bidang || p.bidang === S.bidang) && (!S.project || p.name === S.project));
  const A = shown.map(p => analyze(p, S.periode));
  const n = s => A.filter(a => a.status === s).length;
  $('stats').innerHTML = `<div class="stat t"><b>${A.length}</b><span>Total project</span></div><div class="stat"><b>${n('new')}</b><span>Belum dikirim</span></div><div class="stat p"><b>${n('proc')}</b><span>Dalam proses</span></div><div class="stat d"><b>${n('done')}</b><span>Selesai</span></div>`;
  if (!shown.length) { $('grid').innerHTML = '<div class="empty">Tidak ada project untuk filter ini.</div>'; return; }
  const LBL = {new:'Belum dikirim', proc:'Dalam proses', done:'Selesai'};
  $('grid').innerHTML = shown.map((p, i) => {
    const a = A[i];
    const track = a.st.map((s, k) => (k ? `<u class="${a.st[k - 1].all ? 'done' : ''}"></u>` : '') + `<i class="${s.state}" title="${esc(s.ket)}">${k + 1}</i>`).join('');
    const pos = a.status === 'new' ? '<small>Belum dikirim ke unit mana pun</small>'
      : a.pos.map(x => `<div>${x.hold ? 'Di <b>' + esc(x.t) + '</b>' : esc(x.t)}${x.d ? ' <small>' + (x.hold ? 'sejak ' : '') + fmt(x.d) + '</small>' : ''}</div>`).join('');
    const col = BCOL[p.bidang] || '#0a7c86';
    return `<div class="card" tabindex="0" data-i="${i}"><div class="top"><span class="tag" style="color:${col}">${esc(p.bidang)}</span><span class="st ${a.status}">${LBL[a.status]}</span></div><h3>${esc(p.name)}</h3><div class="track">${track}</div><div class="pos">${pos}</div><div class="bar"><i style="width:${a.total ? a.done / a.total * 100 : 0}%"></i></div><div class="meta">${a.done} dari ${a.total} unit selesai verifikasi</div></div>`;
  }).join('');
}

/* ---- pop up alur progres ---- */
function renderModal() {
  const P = shown[cur]; if (!P) return;
  const a = analyze(P, S.periode);
  $('mT').textContent = P.name;
  $('mS').textContent = P.bidang + ' · Periode ' + new Date(S.periode + '-01T00:00:00').toLocaleDateString('id-ID', {month:'long', year:'numeric'});
  const keep = $('mB').scrollTop;
  $('mB').innerHTML = a.st.map((s, k) => {
    const later = a.st.slice(k + 1).some(x => x.any);
    return `<section class="stg ${s.state} ${s.open ? '' : 'lock'}"><h4>Tahap ${k + 1}: ${esc(s.ket)}${s.open ? '' : ' (menunggu tahap sebelumnya selesai)'}</h4>` +
      s.us.map(({u, r}) => {
        const at = `data-s="${s.urutan}" data-u="${esc(u)}"`;
        return `<div class="u"><div class="un">${esc(u)}</div>
        <div class="f"><label class="ck"><input type="checkbox" data-a="masuk" ${at} ${r.masuk ? 'checked' : ''} ${!s.open || r.selesai ? 'disabled' : ''}>Berkas Masuk</label><input type="date" data-a="tm" ${at} value="${r.tm}" ${!r.masuk || r.selesai ? 'disabled' : ''}></div>
        <div class="f"><label class="ck"><input type="checkbox" data-a="selesai" ${at} ${r.selesai ? 'checked' : ''} ${!r.masuk || later ? 'disabled' : ''}>Selesai Verifikasi</label><input type="date" data-a="ts" ${at} value="${r.ts}" ${!r.selesai || later ? 'disabled' : ''}></div></div>`;
      }).join('') + '</section>';
  }).join('');
  $('mB').scrollTop = keep;
}

function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('on'), 2200); }

async function save(P, s, u, r) {
  const st = P.stages.find(x => x.urutan === s);
  data[key(P.name, S.periode, s, u)] = r;
  renderModal(); render();
  try {
    const res = await fetch(API_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify({bidang:P.bidang, project:P.name, periode:S.periode, urutan:s, unit:u, ket:st.ket, masuk:r.masuk, tglMasuk:r.tm, selesai:r.selesai, tglSelesai:r.ts})});
    const j = await res.json();
    toast(j.ok ? 'Tersimpan' : 'Gagal menyimpan: ' + (j.error || ''));
  } catch (e) { toast('Penyimpanan belum terkonfirmasi. Tekan Muat ulang untuk memeriksa.'); }
}

$('mB').addEventListener('change', e => {
  const t = e.target, a = t.dataset.a; if (!a) return;
  if (!API_URL) { toast('API_URL belum diisi di index.html'); renderModal(); return; }
  const P = shown[cur], s = +t.dataset.s, u = t.dataset.u, r = {...rec(P.name, S.periode, s, u)};
  if (a === 'masuk') { r.masuk = t.checked; r.tm = t.checked ? (r.tm || today()) : ''; }
  else if (a === 'selesai') { r.selesai = t.checked; r.ts = t.checked ? (r.ts || today()) : ''; }
  else if (a === 'tm') r.tm = t.value;
  else if (a === 'ts') r.ts = t.value;
  save(P, s, u, r);
});

const open = i => { cur = i; renderModal(); $('ov').classList.add('on'); };
const close = () => { $('ov').classList.remove('on'); cur = -1; };
$('grid').addEventListener('click', e => { const c = e.target.closest('.card'); if (c) open(+c.dataset.i); });
$('grid').addEventListener('keydown', e => { if (e.key === 'Enter') { const c = e.target.closest('.card'); if (c) open(+c.dataset.i); } });
$('mX').onclick = close;
$('ov').addEventListener('click', e => { if (e.target.id === 'ov') close(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
$('fBidang').onchange = e => { S.bidang = e.target.value; S.project = ''; fillFilters(); render(); };
$('fProject').onchange = e => { S.project = e.target.value; render(); };
$('fPeriode').onchange = e => { if (e.target.value) { S.periode = e.target.value; render(); } };
$('btnRef').onclick = () => load().then(() => toast('Data dimuat ulang'));
setInterval(() => { if (!$('ov').classList.contains('on')) load(); }, 90000);
load();
</script>
</body>
</html>
